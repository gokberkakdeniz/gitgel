# git2 only reads: Gitgel never calls a git2 API that writes to a repository. Its writes are git
# actions (`src/scripts/git.rs`, SPEC §0): the user's git CLI in a pty, like the user's scripts
# (`portable-pty`, `src/scripts/run.rs`). These bans turn other writes into errors under
# `clippy -D warnings`. The exceptions, each marked `#[allow]` where it happens:
# `src/git/testutil.rs` (tests, inside their own temp folder) and `src/apps.rs` (starts the
# user's terminal).

disallowed-methods = [
  { path = "std::process::Command::new", reason = "no git CLI; use git2" },

  { path = "git2::Repository::init", reason = "read-only app" },
  { path = "git2::Repository::init_bare", reason = "read-only app" },
  { path = "git2::Repository::init_opts", reason = "read-only app" },
