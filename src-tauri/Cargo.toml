[package]
name = "gitgel"
description = "Read-only reviewer for git branches and worktrees"
authors = ["Gökberk Akdeniz"]
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gitgel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = [] }
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-clipboard-manager = "=2.3.3"
tauri-plugin-log = "=2.9.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.21"
log = "=0.4.34"
chrono = "=0.4.45"
uuid = { version = "=1.26.1", features = ["v4"] }
git2 = { version = "=0.21.0", default-features = false, features = ["vendored-libgit2"] }
notify-debouncer-full = "=0.7.0"
tauri-plugin-opener = "=2.5.5"

[dev-dependencies]
tempfile = "=3.27.0"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
