<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&amp;display=swap">
<style>
body{margin:0;font-family:'Instrument Sans',-apple-system,sans-serif;background:#141311;color:#d8d4cc}
a{color:#7fb3c4;text-decoration:none}a:hover{color:#a3cad6}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 1280px; height: 800px; display: flex; background: #141311; overflow: hidden; font-size: 13px; font-family: 'Instrument Sans', -apple-system, sans-serif; color: #d8d4cc">
<dc-import name="Sidebar" active="settings" inbox-count="7" hint-size="260px,800px"></dc-import>

<main style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0">
<header style="height: 64px; flex-shrink: 0; display: flex; align-items: center; padding: 0 32px; border-bottom: 1px solid #302e2a">
<h1 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 22px; font-weight: 400; letter-spacing: -0.3px; color: #faf9f5">Settings</h1>
</header>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 40px; padding: 28px 32px; align-items: start">

<section style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 18px; font-weight: 400; letter-spacing: -0.2px; color: #faf9f5">Repositories</h2>
<div style="display: flex; flex-direction: column; background: #1a1917; border: 1px solid #302e2a; border-radius: 12px; overflow: hidden">
<sc-for list="{{repos}}" as="r" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid #302e2a">
<span style="font-weight: 500; color: #faf9f5; width: 96px; flex-shrink: 0">{{r.name}}</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #a09d96; flex-grow: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.path}}</span>
<span style="{{r.noteStyle}}">{{r.note}}</span>
<sc-if value="{{r.missing}}" hint-placeholder-val="{{false}}">
<button style="height: 28px; padding: 0 12px; background: #2a2825; border: 1px solid #383631; border-radius: 8px; color: #faf9f5; font-size: 12px">Locate…</button>
</sc-if>
<button aria-label="Remove repository" style="width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; border-radius: 8px; color: #a09d96">
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>
</button>
</div>
</sc-for>
<button style="padding: 12px 14px; background: transparent; border: 0; color: #7fb3c4; font-size: 13px; font-weight: 500; text-align: left">+ Add repository…</button>
</div>
</section>

<div style="display: flex; flex-direction: column; gap: 32px">
<section style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 18px; font-weight: 400; letter-spacing: -0.2px; color: #faf9f5">Behaviour</h2>
<label style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="color: #faf9f5">Default base</span><span style="font-size: 12px; color: #a09d96">Tried in order when a branch has no base set</span></span>
<input value="origin/HEAD → main → master" style="width: 230px; height: 36px; padding: 0 12px; background: #1a1917; border: 1px solid #302e2a; border-radius: 8px; color: #faf9f5; font-family: 'JetBrains Mono', monospace; font-size: 12px">
</label>
<label style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="color: #faf9f5">Active threshold</span><span style="font-size: 12px; color: #a09d96">Branches without a worktree are listed if committed within</span></span>
<span style="display: flex; align-items: center; gap: 8px"><input value="14" style="width: 60px; height: 36px; padding: 0 10px; background: #1a1917; border: 1px solid #302e2a; border-radius: 8px; color: #faf9f5; font-family: 'JetBrains Mono', monospace; font-size: 12px; text-align: right"><span style="color: #a09d96">days</span></span>
</label>
</section>
</div>

</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    var ok = 'font-size: 12px; color: #a09d96; white-space: nowrap';
    return {
      repos: [
        { name: 'web-app', path: '~/code/web-app', note: 'base main', noteStyle: ok, missing: false },
        { name: 'api-server', path: '~/code/api-server', note: 'base main', noteStyle: ok, missing: false },
        { name: 'shared-ui', path: '~/code/shared-ui', note: 'base main', noteStyle: ok, missing: false },
        { name: 'admin-panel', path: '~/old/admin-panel', note: 'path not found', noteStyle: 'font-size: 11px; font-weight: 500; white-space: nowrap; color: #ee9a90; background: rgba(198,69,69,0.16); border-radius: 9999px; padding: 3px 10px', missing: true }
      ]
    };
  }
}
</script>
</body>
</html>
