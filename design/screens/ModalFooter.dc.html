<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Modal footer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&amp;display=swap">
<style>
body{margin:0}
.theme-dark{--bg-sidebar:#0e0d0c;--bg-main:#141311;--bg-sunken:#1a1917;--bg-band:#1c1b18;--bg-elevated:#211f1c;--bg-track:#211f1c;--bg-hover:#2a2825;--bg-sidebar-active:#24221f;--bg-pressed:#383631;--border:#302e2a;--border-row:#262420;--border-strong:#383631;--text-strong:#faf9f5;--text-code:#e0ddd6;--text-body:#d8d4cc;--text-muted:#a09d96;--text-faint:#75726b;--text-disabled:#5c5a55;--icon-disabled:#4a4843;--accent:#4f8fa3;--accent-text:#7fb3c4;--accent-hover:#a3cad6;--on-accent:#141311;--success:#8fcf9c;--warning:#e8c071;--danger:#ee9a90;--danger-fill:#c64545;--accent-rgb:79,143,163;--success-rgb:93,184,114;--warning-rgb:212,160,23;--danger-rgb:198,69,69;--shadow:rgba(0,0,0,0.45);--scrim:rgba(0,0,0,0.5)}
.theme-light{--bg-sidebar:#f1efea;--bg-main:#fbfaf7;--bg-sunken:#f4f2ee;--bg-band:#eeebe5;--bg-elevated:#ffffff;--bg-track:#e9e6e0;--bg-hover:#ebe8e1;--bg-sidebar-active:#e4e0d8;--bg-pressed:#ffffff;--border:#e2ded6;--border-row:#ebe8e2;--border-strong:#d5d0c7;--text-strong:#1d1c19;--text-code:#2b2925;--text-body:#3b3934;--text-muted:#6e6a62;--text-faint:#99958c;--text-disabled:#b7b2a9;--icon-disabled:#cbc6bd;--accent:#3a7b8f;--accent-text:#2c6a7d;--accent-hover:#1f5566;--on-accent:#ffffff;--success:#2e7a45;--warning:#8a6212;--danger:#b3463b;--danger-fill:#c64545;--accent-rgb:58,123,143;--success-rgb:46,140,78;--warning-rgb:196,146,20;--danger-rgb:200,72,60;--shadow:rgba(40,32,20,0.14);--scrim:rgba(30,26,20,0.28)}
</style>
</helmet>
<div class="{{themeClass}}" style="{{rowStyle}}">
<sc-if value="{{hasLead}}" hint-placeholder-val="{{false}}"><dc-import name="Button" theme="none" label="{{lead.label}}" variant="{{lead.variant}}" icon="{{lead.icon}}" href="{{lead.href}}" on-press="{{lead.onPress}}" hint-size="200px,20px"></dc-import></sc-if>
<span style="{{noteStyle}}">{{note}}</span>
<sc-if value="{{hasAside}}" hint-placeholder-val="{{false}}"><span style="flex-shrink: 0; font-family: 'Instrument Sans', -apple-system, sans-serif; font-size: 12px; color: var(--text-muted)">{{aside}}</span></sc-if>
<sc-for list="{{buttons}}" as="b" hint-placeholder-count="2">
<dc-import name="Button" theme="none" label="{{b.label}}" variant="{{b.variant}}" size="{{b.size}}" kbd="{{b.kbd}}" icon="{{b.icon}}" href="{{b.href}}" disabled="{{b.disabled}}" on-press="{{b.onPress}}" hint-size="96px,36px"></dc-import>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"note":{"editor":"text","default":"Last values are kept for this branch"},"aside":{"editor":"text","default":""},"noteMono":{"editor":"boolean","default":false},"ruled":{"editor":"boolean","default":true},"theme":{"editor":"enum","options":["dark","light","none"],"default":"dark"},"buttons":{"editor":null},"lead":{"editor":null},"$preview":{"width":600,"height":64}}'>
class Component extends DCLogic {
  renderVals() {
    // The bottom of every Modal: bg.sunken, padding 14px 24px, a 1px top rule (ruled: false when
    // the list above already ends in a row border). A 12px muted note on the left (noteMono for a
    // path) or a lead link button in its place ("Try on …"), an optional aside before the buttons, then the buttons right-aligned: Button props,
    // 36px by default, Cancel first and the primary action last.
    var p = this.props;
    var buttons = p.buttons || [{ label: 'Cancel' }, { label: 'Run', variant: 'primary', kbd: '⌘↵' }];
    var aside = p.aside == null ? '' : String(p.aside);
    return {
      themeClass: p.theme === 'none' ? '' : 'theme-' + (p.theme || 'dark'),
      note: p.note == null ? '' : p.note,
      noteStyle: 'flex-grow: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-muted); ' + (p.noteMono ? 'font-family: \'JetBrains Mono\', monospace; font-size: 11px' : 'font-family: \'Instrument Sans\', -apple-system, sans-serif; font-size: 12px'),
      hasAside: !!aside, aside: aside,
      hasLead: !!p.lead,
      lead: p.lead ? { label: p.lead.label, variant: p.lead.variant || 'link', icon: p.lead.icon || 'none', href: p.lead.href, onPress: p.lead.onPress } : {},
      buttons: buttons.map(function (b) {
        return { label: b.label, variant: b.variant || 'secondary', size: String(b.size || 36), kbd: b.kbd || '', icon: b.icon || 'none', href: b.href, disabled: !!b.disabled, onPress: b.onPress };
      }),
      rowStyle: 'box-sizing: border-box; width: 100%; display: flex; align-items: center; gap: 8px; padding: 14px 24px; background: var(--bg-sunken);' + (p.ruled === false ? '' : ' border-top: 1px solid var(--border);')
    };
  }
}
</script>
</body>
</html>
