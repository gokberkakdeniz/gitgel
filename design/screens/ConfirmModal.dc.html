<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Confirm modal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&amp;display=swap">
<style>
body{margin:0}
.theme-dark{--bg-sidebar:#0e0d0c;--bg-main:#141311;--bg-sunken:#1a1917;--bg-band:#1c1b18;--bg-elevated:#211f1c;--bg-track:#211f1c;--bg-hover:#2a2825;--bg-sidebar-active:#24221f;--bg-pressed:#383631;--border:#302e2a;--border-row:#262420;--border-strong:#383631;--text-strong:#faf9f5;--text-code:#e0ddd6;--text-body:#d8d4cc;--text-muted:#a09d96;--text-faint:#75726b;--text-disabled:#5c5a55;--icon-disabled:#4a4843;--accent:#4f8fa3;--accent-text:#7fb3c4;--accent-hover:#a3cad6;--on-accent:#141311;--success:#8fcf9c;--warning:#e8c071;--danger:#ee9a90;--kind-r:#93b8ee;--kind-u:#c5b2f2;--accent-rgb:79,143,163;--success-rgb:93,184,114;--warning-rgb:212,160,23;--danger-rgb:198,69,69;--kind-r-rgb:90,140,220;--kind-u-rgb:160,130,230;--shadow:rgba(0,0,0,0.45);--scrim:rgba(0,0,0,0.5)}
.theme-light{--bg-sidebar:#f1efea;--bg-main:#fbfaf7;--bg-sunken:#f4f2ee;--bg-band:#eeebe5;--bg-elevated:#ffffff;--bg-track:#e9e6e0;--bg-hover:#ebe8e1;--bg-sidebar-active:#e4e0d8;--bg-pressed:#ffffff;--border:#e2ded6;--border-row:#ebe8e2;--border-strong:#d5d0c7;--text-strong:#1d1c19;--text-code:#2b2925;--text-body:#3b3934;--text-muted:#6e6a62;--text-faint:#99958c;--text-disabled:#b7b2a9;--icon-disabled:#cbc6bd;--accent:#3a7b8f;--accent-text:#2c6a7d;--accent-hover:#1f5566;--on-accent:#ffffff;--success:#2e7a45;--warning:#8a6212;--danger:#b3463b;--kind-r:#2f63a8;--kind-u:#6a4fb5;--accent-rgb:58,123,143;--success-rgb:46,140,78;--warning-rgb:196,146,20;--danger-rgb:200,72,60;--kind-r-rgb:60,110,200;--kind-u-rgb:140,100,220;--shadow:rgba(40,32,20,0.14);--scrim:rgba(30,26,20,0.28)}
</style>
</helmet>
<div class="{{themeClass}}" role="alertdialog" aria-label="{{label}}" style="{{boxStyle}}">
<div style="overflow-wrap: anywhere; font-family: 'Source Serif 4', Georgia, serif; font-size: 22px; letter-spacing: -0.3px; color: var(--text-strong)">{{title}}</div>
<sc-if value="{{hasText}}" hint-placeholder-val="{{true}}">
<p style="margin: 0; font-size: 14px; line-height: 1.55; color: var(--text-body)">{{text}}</p>
</sc-if>
<sc-if value="{{hasContext}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; background: var(--bg-sunken); border: 1px solid var(--border); border-radius: 10px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-code)">
<sc-for list="{{context}}" as="c" hint-placeholder-count="2">
<span title="{{c.title}}" style="display: flex; align-items: center; gap: 10px; min-width: 0"><span style="flex-shrink: 0; display: flex; color: var(--text-muted)"><dc-import name="Icon" icon="{{c.icon}}" size="14" hint-size="14px,14px"></dc-import></span><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.text}}</span></span>
</sc-for>
</div>
</sc-if>
<sc-if value="{{hasNote}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; font-size: 13px; line-height: 1.5; color: var(--text-muted)">{{note}}</p>
</sc-if>
<sc-if value="{{dontAsk}}" hint-placeholder-val="{{false}}">
<dc-import name="Checkbox" theme="none" checked="{{false}}" label="Do not show this message again" hint-size="240px,20px"></dc-import>
</sc-if>
<div style="{{actionsStyle}}">
<sc-for list="{{buttons}}" as="b" hint-placeholder-count="2">
<dc-import name="Button" theme="none" label="{{b.label}}" variant="{{b.variant}}" size="36" kbd="{{b.kbd}}" hint-size="96px,36px"></dc-import>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"Delete “Session auth refresh”?"},"text":{"editor":"text","default":"Removes the project and its 6 entries. Nothing on disk is touched."},"note":{"editor":"text","default":""},"dontAsk":{"editor":"boolean","default":false},"width":{"editor":"int","default":440},"theme":{"editor":"enum","options":["dark","light","none"],"default":"dark"},"label":{"editor":null},"context":{"editor":null},"buttons":{"editor":null},"$preview":{"width":440,"height":190}}'>
class Component extends DCLogic {
  renderVals() {
    // The app's ConfirmModal (src/components/ConfirmModal.tsx), the dialog box without its scrim:
    // a serif title, then a text (Delete project G, Remove repository) or a box naming what it acts
    // on, one icon row each, with a muted note (Drop stash P6, Run O3), then the 36px buttons on the
    // right, the action last. With the box the parts sit 14px apart (10px without) and the buttons
    // 4px under it (10px under the text). dontAsk: a "Do not show this message again" checkbox above
    // the buttons (GitHub Desktop's; it turns the dialog's Settings › Prompts box off, M6), on the
    // dialogs Prompts lists: Delete project, Remove repository, Drop stash.
    var p = this.props;
    var context = p.context || [];
    var boxed = context.length > 0;
    var buttons = p.buttons || [{ label: 'Cancel' }, { label: 'Delete Project…', variant: 'danger' }];
    return {
      themeClass: p.theme === 'none' ? '' : 'theme-' + (p.theme || 'dark'),
      label: p.label || p.title || '',
      title: p.title == null ? 'Delete “Session auth refresh”?' : p.title,
      text: p.text == null ? (boxed ? '' : 'Removes the project and its 6 entries. Nothing on disk is touched.') : p.text,
      hasText: p.text == null ? !boxed : !!p.text,
      hasContext: boxed,
      context: context.map(function (c) { return { icon: c.icon, text: c.text, title: c.title || '' }; }),
      note: p.note || '',
      hasNote: !!p.note,
      dontAsk: !!p.dontAsk,
      buttons: buttons.map(function (b) { return { label: b.label, variant: b.variant || 'secondary', kbd: b.kbd || '' }; }),
      boxStyle: 'position: relative; width: ' + (p.width || 440) + 'px; box-sizing: border-box; display: flex; flex-direction: column; gap: ' + (boxed ? 14 : 10) + 'px; padding: 22px 24px 18px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 24px 60px var(--shadow); font-family: \'Instrument Sans\', -apple-system, sans-serif; font-size: 13px; color: var(--text-body)',
      actionsStyle: 'display: flex; justify-content: flex-end; gap: 8px; margin-top: ' + (boxed ? 4 : 10) + 'px'
    };
  }
}
</script>
</body>
</html>
