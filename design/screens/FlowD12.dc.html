<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>D12 · Discard across entries</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&amp;display=swap">
<style>
body{margin:0;font-family:'Instrument Sans',-apple-system,sans-serif;background:#141311;color:#d8d4cc}
button{font-family:inherit}
.theme-dark{--bg-sidebar:#0e0d0c;--bg-main:#141311;--bg-sunken:#1a1917;--bg-band:#1c1b18;--bg-elevated:#211f1c;--bg-track:#211f1c;--bg-hover:#2a2825;--bg-sidebar-active:#24221f;--bg-pressed:#383631;--border:#302e2a;--border-row:#262420;--border-strong:#383631;--text-strong:#faf9f5;--text-code:#e0ddd6;--text-body:#d8d4cc;--text-muted:#a09d96;--text-faint:#75726b;--text-disabled:#5c5a55;--icon-disabled:#4a4843;--accent:#4f8fa3;--accent-text:#7fb3c4;--accent-hover:#a3cad6;--on-accent:#141311;--success:#8fcf9c;--warning:#e8c071;--danger:#ee9a90;--kind-r:#93b8ee;--kind-u:#c5b2f2;--accent-rgb:79,143,163;--success-rgb:93,184,114;--warning-rgb:212,160,23;--danger-rgb:198,69,69;--kind-r-rgb:90,140,220;--kind-u-rgb:160,130,230;--shadow:rgba(0,0,0,0.45);--scrim:rgba(0,0,0,0.5)}
.theme-light{--bg-sidebar:#f1efea;--bg-main:#fbfaf7;--bg-sunken:#f4f2ee;--bg-band:#eeebe5;--bg-elevated:#ffffff;--bg-track:#e9e6e0;--bg-hover:#ebe8e1;--bg-sidebar-active:#e4e0d8;--bg-pressed:#ffffff;--border:#e2ded6;--border-row:#ebe8e2;--border-strong:#d5d0c7;--text-strong:#1d1c19;--text-code:#2b2925;--text-body:#3b3934;--text-muted:#6e6a62;--text-faint:#99958c;--text-disabled:#b7b2a9;--icon-disabled:#cbc6bd;--accent:#3a7b8f;--accent-text:#2c6a7d;--accent-hover:#1f5566;--on-accent:#ffffff;--success:#2e7a45;--warning:#8a6212;--danger:#b3463b;--kind-r:#2f63a8;--kind-u:#6a4fb5;--accent-rgb:58,123,143;--success-rgb:46,140,78;--warning-rgb:196,146,20;--danger-rgb:200,72,60;--kind-r-rgb:60,110,200;--kind-u-rgb:140,100,220;--shadow:rgba(40,32,20,0.14);--scrim:rgba(30,26,20,0.28)}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 1280px; height: 800px; position: relative; display: flex; justify-content: center; align-items: flex-start; background: var(--bg-main); overflow: hidden; font-size: 13px; font-family: 'Instrument Sans', -apple-system, sans-serif; color: var(--text-body)">
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 1280px; height: 800px">
<dc-import name="Diff" scope="project" mode="Uncommitted" base-menu="{{false}}" selected="{{selected}}" theme="{{themeName}}" hint-size="1280px,800px"></dc-import>
</div>
<sc-if value="{{isMenu}}" hint-placeholder-val="{{true}}">
<div style="{{menuPos}}"><dc-import name="Menu" theme="{{themeName}}" width="230" label="{{menuLabel}}" items="{{fileMenu}}" hint-size="230px,260px"></dc-import></div>
</sc-if>
<sc-if value="{{isConfirm}}" hint-placeholder-val="{{false}}">
<div aria-hidden="true" style="position: absolute; inset: 0; background: var(--scrim)"></div>
<div role="alertdialog" aria-labelledby="discard-title" style="position: relative; margin-top: 160px; width: 480px; display: flex; flex-direction: column; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 24px 60px var(--shadow); overflow: hidden">
<dc-import name="ModalHeader" theme="{{themeName}}" title="{{title}}" sub="" close="{{true}}" title-id="discard-title" hint-size="100%,64px"></dc-import>
<div style="display: flex; gap: 16px; padding: 4px 24px 22px">
<span style="flex-shrink: 0; display: flex"><dc-import name="Icon" icon="warning" size="28" stroke="1.6" color="var(--warning)" hint-size="28px,28px"></dc-import></span>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: var(--text-body)">{{lead}}</p>
<sc-if value="{{hasList}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{entries}}" as="e" hint-placeholder-count="2">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="display: flex; align-items: baseline; gap: 8px; min-width: 0"><span style="font-size: 12px; font-weight: 600; color: var(--text-strong)">{{e.repo}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{e.branch}}</span></span>
<sc-for list="{{e.files}}" as="f" hint-placeholder-count="1">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-code); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{f}}</span>
</sc-for>
</div>
</sc-for>
</div>
</sc-if>
<p style="margin: 0; font-size: 13px; line-height: 1.5; color: var(--text-muted)">Changes can be restored by retrieving them from the Trash.</p>
<sc-if value="{{hasList}}" hint-placeholder-val="{{true}}">
<dc-import name="Checkbox" theme="none" checked="{{false}}" label="Do not show this message again" hint-size="240px,20px"></dc-import>
</sc-if>
</div>
</div>
<dc-import name="ModalFooter" theme="{{themeName}}" note="" buttons="{{buttons}}" hint-size="100%,64px"></dc-import>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;step&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;menu&quot;,&quot;confirm&quot;],&quot;default&quot;:&quot;confirm&quot;},&quot;count&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;two&quot;,&quot;one&quot;],&quot;default&quot;:&quot;two&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800}}">
class Component extends DCLogic {
  renderVals() {
    var t = this.props.theme || 'dark';
    var step = this.props.step || 'menu';
    var two = (this.props.count || 'two') === 'two';
    // Review, Uncommitted (branch or project): Hi8's discard, across entries. ⌘-click / ⇧-click
    // picks files, in one entry or several (tinted; the diff keeps the file it shows); a plain click
    // picks just that one again, esc clears. Right-click on a picked file acts on all picked ones;
    // on any other file, on that file alone (count one). The menu, texts as GitHub Desktop's (Hi8,
    // no Include / Exclude: Review has no boxes): Discard first, copy paths, the open items (D11).
    // Confirm Discard Changes as Hi8, its files under their entry (repo, branch); more than 10
    // files: the count only, no list, no "Do not show this message again". Settings › Prompts ›
    // "Discarding changes" (M6) skips it. Each entry discards in its own worktree: a copy of each
    // file goes to the Trash ("<file name> <HH-mm-ss-SSS><ext>"), then git restore --source=HEAD
    // --staged --worktree -- <paths>; an untracked file is removed after its copy. No backup stash.
    var entries = two
      ? [{ id: 'web', repo: 'web-app', branch: 'session-token-refresh', files: [{ name: 'token-debug.ts', path: 'scripts/token-debug.ts' }] },
         { id: 'api', repo: 'api-server', branch: 'token-rotation-job', files: [{ name: 'rotate-tokens.ts', path: 'src/jobs/rotate-tokens.ts' }] }]
      : [{ id: 'web', repo: 'web-app', branch: 'session-token-refresh', files: [{ name: 'refresh.test.ts', path: 'test/auth/refresh.test.ts' }] }];
    var all = [];
    entries.forEach(function (e) { e.files.forEach(function (f) { all.push({ key: e.id + '/' + f.name, name: f.name }); }); });
    var n = all.length;
    var open = [{ kind: 'sep' }, { label: 'Open in Finder', app: 'finder' }, { label: 'Open in Cursor', app: 'cursor' }, { label: 'Open in VS Code', app: 'vscode' }];
    return {
      themeClass: 'theme-' + t, themeName: t,
      selected: two ? all.map(function (f) { return f.key; }) : [],
      isMenu: step === 'menu', isConfirm: step === 'confirm',
      menuPos: 'position: absolute; left: 190px; top: ' + (two ? 330 : 214) + 'px; z-index: 5',
      menuLabel: n === 1 ? all[0].name + ' actions' : n + ' files actions',
      fileMenu: (n === 1
        ? [{ label: 'Discard Changes…', danger: true, active: true }, { kind: 'sep' },
           { label: 'Copy File Path', icon: 'copy' }, { label: 'Copy Relative File Path', icon: 'copy' }]
        : [{ label: 'Discard ' + n + ' Selected Changes…', danger: true, active: true }, { kind: 'sep' },
           { label: 'Copy Paths', icon: 'copy' }, { label: 'Copy Relative Paths', icon: 'copy' }]).concat(open),
      hasList: n <= 10,
      title: 'Confirm Discard Changes',
      lead: n > 10 ? 'Are you sure you want to discard all ' + n + ' changed files?' : 'Are you sure you want to discard all changes to:',
      entries: entries.map(function (e) { return { repo: e.repo, branch: e.branch, files: e.files.map(function (f) { return f.path; }) }; }),
      buttons: [{ label: 'Cancel' }, { label: 'Discard Changes', variant: 'danger' }]
    };
  }
}
</script>
</body>
</html>
