<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>V1 · New branch</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&amp;display=swap">
<style>
body{margin:0;font-family:'Instrument Sans',-apple-system,sans-serif;background:#141311;color:#d8d4cc}
a{color:var(--accent-text,#7fb3c4);text-decoration:none}a:hover{color:var(--accent-hover,#a3cad6)}
button,input{font-family:inherit}
.theme-dark{--bg-main:#141311;--bg-sunken:#1a1917;--bg-elevated:#211f1c;--bg-hover:#2a2825;--border:#302e2a;--border-row:#262420;--border-strong:#383631;--text-strong:#faf9f5;--text-code:#e0ddd6;--text-body:#d8d4cc;--text-muted:#a09d96;--text-faint:#75726b;--text-disabled:#5c5a55;--accent:#4f8fa3;--accent-text:#7fb3c4;--on-accent:#141311;--accent-rgb:79,143,163;--danger:#ee9a90;--danger-text:#ee9a90;--shadow:rgba(0,0,0,0.45)}
.theme-light{--bg-main:#fbfaf7;--bg-sunken:#f4f2ee;--bg-elevated:#ffffff;--bg-hover:#ebe8e1;--border:#e2ded6;--border-row:#ebe8e2;--border-strong:#d5d0c7;--text-strong:#1d1c19;--text-code:#2b2925;--text-body:#3b3934;--text-muted:#6e6a62;--text-faint:#99958c;--text-disabled:#b7b2a9;--accent:#3a7b8f;--accent-text:#2c6a7d;--on-accent:#ffffff;--accent-rgb:58,123,143;--danger:#b3463b;--danger-text:#b3463b;--shadow:rgba(40,32,20,0.14)}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 1280px; height: 800px; position: relative; background: var(--bg-main); overflow: hidden; font-size: 13px; font-family: 'Instrument Sans', -apple-system, sans-serif; color: var(--text-body)">
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 1280px; height: 800px">
<dc-import name="Main" theme="{{themeName}}" popover="none" new-branch="{{true}}" hint-size="1280px,800px"></dc-import>
</div>

<div role="dialog" aria-label="New Branch" style="position: absolute; left: 770px; top: 149px; width: 400px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; padding: 16px; background: var(--bg-elevated); border: 1px solid var(--border-strong); border-radius: 12px; box-shadow: 0 12px 32px var(--shadow)">
<div style="font-family: 'Source Serif 4', Georgia, serif; font-size: 18px; letter-spacing: -0.3px; color: var(--text-strong)">New Branch</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="v1-name" style="font-size: 12px; font-weight: 500; color: var(--text-body)">Name</label>
<input id="v1-name" value="{{name}}" style="{{nameStyle}}">
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="v1-base" style="font-size: 12px; font-weight: 500; color: var(--text-body)">Base</label>
<button id="v1-base" type="button" aria-haspopup="listbox" style="width: 100%; height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 11px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 8px; color: var(--text-strong); cursor: pointer">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; stroke: var(--text-muted)"><circle cx="6" cy="6" r="2.2"></circle><circle cx="6" cy="18" r="2.2"></circle><circle cx="18" cy="9" r="2.2"></circle><path d="M6 8.2v7.6"></path><path d="M18 11.2c0 3-3 4.3-9.8 5"></path></svg>
<span style="flex-grow: 1; text-align: left; font-family: 'JetBrains Mono', monospace; font-size: 12px">origin/main</span>
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; color: var(--text-muted)"><path d="m6 9 6 6 6-6"></path></svg>
</button>
</div>

<dc-import name="Checkbox" theme="none" label="Check out" checked="{{checkOut}}" hint-size="200px,20px"></dc-import>

<sc-if value="{{checkOut}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 14px; margin-top: -4px; padding-left: 24px">
<dc-import name="Checkbox" theme="none" label="In a new worktree" checked="{{worktree}}" hint-size="200px,20px"></dc-import>
<sc-if value="{{showChanges}}" hint-placeholder-val="{{false}}">
<dc-import name="Checkbox" theme="none" label="Bring 3 uncommitted changes" checked="{{true}}" hint-size="240px,20px"></dc-import>
</sc-if>
<sc-if value="{{worktree}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="v1-folder" style="font-size: 12px; font-weight: 500; color: var(--text-body)">Folder</label>
<div style="display: flex; gap: 8px">
<input id="v1-folder" value="{{folder}}" title="{{folder}}" style="{{folderStyle}}">
<button type="button" style="height: 32px; flex-shrink: 0; padding: 0 12px; background: var(--bg-elevated); border: 1px solid var(--border-strong); border-radius: 8px; color: var(--text-strong); font-size: 13px; font-weight: 500; cursor: pointer">Choose…</button>
</div>
</div>
</sc-if>
</div>
</sc-if>

<sc-if value="{{error}}" hint-placeholder-val="{{false}}">
<div style="margin-top: -6px; font-size: 12px; color: var(--danger-text)">{{error}}</div>
</sc-if>

<div style="display: flex; justify-content: flex-end; gap: 8px">
<button type="button" style="height: 32px; padding: 0 14px; background: var(--bg-elevated); border: 1px solid var(--border-strong); border-radius: 8px; color: var(--text-strong); font-size: 13px; font-weight: 500; cursor: pointer">Cancel</button>
<button type="button" disabled="{{off}}" style="{{createStyle}}">Create Branch <span style="font-size: 11px; opacity: 0.7">↵</span></button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"case":{"editor":"enum","options":["worktree","repoFolder","repoFolderConflict","branchOnly","exists"],"default":"worktree"},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
// New Branch: the "+" on a Branches repo band (shown on hover, before Fetch) opens this form
// under it. Name, Base (the repo's default base first; a list with a filter opens under the
// field), then checkboxes: Check out (checked; cleared: the branch only) and under it In a new
// worktree (checked; Folder <repo folder's parent>/<repo>-worktrees/<branch, / as ->, following
// the name until typed in; Choose… picks the folder that holds it). Cleared, the repository
// folder switches to the branch; with uncommitted changes there, Bring N uncommitted changes
// (checked; cleared, they are stashed). Checked as it is typed: a danger line says what stops
// it and Create Branch stays disabled. Runs `git worktree add --no-track -b`, `git switch
// --no-track -c` (after `git stash push` when not brought) or `git branch --no-track`.
// worktree: feat/job-queue from origin/main into ~/code/web-app-worktrees/feat-job-queue.
// repoFolder: the repository folder has 3 changes, they come along. repoFolderConflict: one of
// them also changed on the base, so they cannot come along. branchOnly: Check out cleared.
// exists: the name is taken.
var theme = this.props.theme ?? 'dark';
var c = this.props.case || 'worktree';
var where = c === 'repoFolder' || c === 'repoFolderConflict' ? 'main' : c === 'branchOnly' ? 'none' : 'worktree';
var name = c === 'exists' ? 'feat/billing-v2' : 'feat/job-queue';
var error = c === 'exists' ? 'feat/billing-v2 already exists' : c === 'repoFolderConflict' ? 'The changes conflict with origin/main' : '';
var field = function (focus, invalid) {
  return 'width: 100%; min-width: 0; height: 32px; box-sizing: border-box; padding: 0 10px; background: var(--bg-sunken); border: 1px solid ' +
    (invalid ? 'var(--danger)' : focus ? 'var(--accent)' : 'var(--border)') + '; border-radius: 8px; outline: none; color: var(--text-strong); font-family: \'JetBrains Mono\', monospace; font-size: 12px' +
    (focus && !invalid ? '; box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.2)' : '');
};
var off = !!error;
return { themeClass: 'theme-' + theme, themeName: theme,
  name: name,
  nameStyle: field(true, c === 'exists'),
  checkOut: where !== 'none',
  worktree: where === 'worktree',
  showChanges: where === 'main',
  folder: '~/code/web-app-worktrees/' + name.replace(/\//g, '-'),
  folderStyle: field(false, false) + '; flex-grow: 1',
  error: error,
  off: off,
  createStyle: 'height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border: 0; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; ' +
    (off ? 'background: var(--bg-hover); color: var(--text-disabled)' : 'background: var(--accent); color: var(--on-accent)') };
}
}
</script>
</body>
</html>
