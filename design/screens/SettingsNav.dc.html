<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings sections</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&amp;display=swap">
<style>
body{margin:0}
.theme-dark{--bg-sidebar:#0e0d0c;--bg-main:#141311;--bg-sunken:#1a1917;--bg-band:#1c1b18;--bg-elevated:#211f1c;--bg-track:#211f1c;--bg-hover:#2a2825;--bg-sidebar-active:#24221f;--bg-pressed:#383631;--border:#302e2a;--border-row:#262420;--border-strong:#383631;--text-strong:#faf9f5;--text-code:#e0ddd6;--text-body:#d8d4cc;--text-muted:#a09d96;--text-faint:#75726b;--text-disabled:#5c5a55;--icon-disabled:#4a4843;--accent:#4f8fa3;--accent-text:#7fb3c4;--accent-hover:#a3cad6;--on-accent:#141311;--success:#8fcf9c;--warning:#e8c071;--danger:#ee9a90;--danger-fill:#c64545;--accent-rgb:79,143,163;--success-rgb:93,184,114;--warning-rgb:212,160,23;--danger-rgb:198,69,69;--shadow:rgba(0,0,0,0.45);--scrim:rgba(0,0,0,0.5)}
.theme-light{--bg-sidebar:#f1efea;--bg-main:#fbfaf7;--bg-sunken:#f4f2ee;--bg-band:#eeebe5;--bg-elevated:#ffffff;--bg-track:#e9e6e0;--bg-hover:#ebe8e1;--bg-sidebar-active:#e4e0d8;--bg-pressed:#ffffff;--border:#e2ded6;--border-row:#ebe8e2;--border-strong:#d5d0c7;--text-strong:#1d1c19;--text-code:#2b2925;--text-body:#3b3934;--text-muted:#6e6a62;--text-faint:#99958c;--text-disabled:#b7b2a9;--icon-disabled:#cbc6bd;--accent:#3a7b8f;--accent-text:#2c6a7d;--accent-hover:#1f5566;--on-accent:#ffffff;--success:#2e7a45;--warning:#8a6212;--danger:#b3463b;--danger-fill:#c64545;--accent-rgb:58,123,143;--success-rgb:46,140,78;--warning-rgb:196,146,20;--danger-rgb:200,72,60;--shadow:rgba(40,32,20,0.14);--scrim:rgba(30,26,20,0.28)}
</style>
</helmet>
<nav aria-label="Settings sections" class="{{themeClass}}" style="box-sizing: border-box; width: 200px; height: 100%; flex-shrink: 0; background: var(--bg-main); display: flex; flex-direction: column; gap: 2px; padding: 16px 10px; border-right: 1px solid var(--border-row); font-family: 'Instrument Sans', -apple-system, sans-serif">
<sc-for list="{{sections}}" as="s" hint-placeholder-count="4">
<button type="button" aria-current="{{s.current}}" onClick="{{s.pick}}" style="{{s.style}}">
<dc-import name="Icon" icon="{{s.icon}}" size="16" stroke="1.7" color="var(--text-muted)" hint-size="16px,16px"></dc-import>
<span style="flex-grow: 1">{{s.label}}</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-muted)">{{s.count}}</span>
</button>
</sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"current":{"editor":"enum","options":["general","repositories","scripts","shortcuts"],"default":"general"},"theme":{"editor":"enum","options":["dark","light","none"],"default":"dark"},"sections":{"editor":null},"$preview":{"width":200,"height":220}}'>
class Component extends DCLogic {
  renderVals() {
    // Settings' section list (VS Code-style): 200px, 34px rows, 16px line icon, a mono count on
    // the right; the current section on bg.sidebar-active, 500. sections: [{ id, label, icon,
    // count?, pick? }]; current is the id shown.
    var p = this.props;
    // Icons by section id, from the Icon set.
    var ICON = { general: 'tune', repositories: 'folder', scripts: 'prompt', shortcuts: 'keyboard' };
    var list = p.sections || [
      { id: 'general', label: 'General' }, { id: 'repositories', label: 'Repositories', count: '4' },
      { id: 'scripts', label: 'Scripts', count: '5' }, { id: 'shortcuts', label: 'Shortcuts' }
    ];
    var current = p.current || 'general';
    return {
      themeClass: p.theme === 'none' ? '' : 'theme-' + (p.theme || 'dark'),
      sections: list.map(function (s) {
        var on = s.id === current;
        return {
          label: s.label, icon: s.icon || ICON[s.id] || 'tune', count: s.count || '',
          current: on ? 'page' : undefined, pick: s.pick,
          style: 'display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border: 0; border-radius: 8px; font-family: inherit; font-size: 13px; text-align: left; cursor: pointer; ' +
            (on ? 'background: var(--bg-sidebar-active); color: var(--text-strong); font-weight: 500' : 'background: transparent; color: var(--text-code)')
        };
      })
    };
  }
}
</script>
</body>
</html>
