<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hi9 · Switch Branch</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&amp;display=swap">
<style>
body{margin:0;font-family:'Instrument Sans',-apple-system,sans-serif;background:#141311;color:#d8d4cc}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; background: #141311; overflow: hidden; font-size: 13px; font-family: 'Instrument Sans', -apple-system, sans-serif; color: #d8d4cc">

<div aria-hidden="true" style="position: absolute; inset: 0">
<dc-import name="HistH2" variant="branch" hint-size="1280px,800px"></dc-import>
</div>
<div style="position: absolute; inset: 0; background: rgba(0,0,0,0.5)"></div>

<div role="dialog" aria-label="Switch Branch…" style="position: absolute; left: 330px; top: 96px; width: 620px; background: #211f1c; border: 1px solid #302e2a; border-radius: 16px; box-shadow: 0 24px 60px rgba(0,0,0,0.5); display: flex; flex-direction: column; overflow: hidden">
<label style="display: flex; align-items: center; gap: 12px; padding: 0 20px; height: 56px; border-bottom: 1px solid #302e2a">
<svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#a09d96" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search Branches</span>
<input value="token" style="flex-grow: 1; min-width: 0; background: transparent; border: 0; outline: none; color: #faf9f5; font-size: 16px">
<span style="font-size: 12px; color: #a09d96; white-space: nowrap">web-app</span>
</label>

<div style="display: flex; flex-direction: column; padding: 6px; max-height: 470px; overflow: hidden">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column">
<div style="padding: 10px 12px 4px; font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #a09d96">{{g.title}}</div>
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="2">
<div style="{{it.rowStyle}}">
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #faf9f5">{{it.branch}}</span>
<span style="font-size: 12px; color: #a09d96">{{it.meta}}</span>
</span>
<sc-if value="{{it.hasTag}}" hint-placeholder-val="{{false}}"><dc-import name="Pill" label="{{it.tag}}" tone="{{it.tagTone}}" hint-size="80px,20px"></dc-import></sc-if>
</div>
</sc-for>
</div>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    // The Add palette's dialog for one repo: no checkboxes, no footer. A click or ↵ switches.
    // The open rev is dimmed with a neutral "Current" pill; merged ones carry "Merged".
    var row = function (b, meta, tag, active) {
      var current = tag === 'Current';
      return {
        branch: b, meta: meta, tag: tag, hasTag: !!tag, tagTone: current ? 'neutral' : 'success',
        rowStyle: 'display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 8px; cursor: pointer; ' + (active ? 'background: #2a2825; ' : '') + (current ? 'opacity: 0.55; cursor: default' : '')
      };
    };
    return { groups: [
      { title: 'Worktrees', items: [
        row('session-token-refresh', '~/code/wt/token-refresh · ↑4 · 5 files · ● 3 uncommitted', 'Current', false),
        row('token-cache-warmup', '~/code/wt/cache · ↑1 · 2 files', '', true)
      ]},
      { title: 'Active branches', items: [
        row('feat/token-scopes', '↑3 · 7 files · 2d ago', '', false)
      ]},
      { title: 'Older · found by search', items: [
        row('fix/token-expiry-clock-skew', 'merged into main · 41d ago', 'Merged', false)
      ]},
      { title: 'Remote Branches', items: [
        row('origin/token-audit-log', '5d ago', '', false)
      ]}
    ] };
  }
}
</script>
</body>
</html>
