<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kind badge · variants</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&amp;display=swap">
<style>body{margin:0;background:#141311}</style>
</helmet>
<div style="width: 1040px; height: 420px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px; padding: 40px 48px; background: #141311; font-family: 'Instrument Sans', -apple-system, sans-serif; color: #d8d4cc; font-size: 13px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 28px; font-weight: 400; letter-spacing: -0.5px; color: #faf9f5">Kind badge</h1>
<p style="margin: 0; max-width: 820px; color: #a09d96; line-height: 1.55">A file's change kind before its name (Review, History, the stash dialog). 18px square, radius 5, mono 10px/500. <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #e0ddd6">C</span> (merge conflict): D's colours with a 1px inset ring.</p>
</div>
<section style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #a09d96">Kinds</h2>
<div style="display: flex; align-items: flex-end; gap: 32px; flex-wrap: wrap">
<sc-for list="{{kinds}}" as="k" hint-placeholder-count="6">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px"><dc-import name="KindBadge" kind="{{k.kind}}" hint-size="18px,18px"></dc-import><span style="font-size: 12px; color: #75726b">{{k.label}}</span></div>
</sc-for>
</div>
</section>
<section style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #a09d96">Light</h2>
<div style="display: flex; align-items: center; gap: 32px; flex-wrap: wrap; padding: 20px 24px; background: #fbfaf7; border-radius: 12px">
<sc-for list="{{kinds}}" as="k" hint-placeholder-count="6">
<dc-import name="KindBadge" theme="light" kind="{{k.kind}}" hint-size="18px,18px"></dc-import>
</sc-for>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1040,"height":420}}'>
class Component extends DCLogic {
  renderVals() {
    return { kinds: [['A', 'added'], ['M', 'modified'], ['R', 'renamed'], ['D', 'deleted'], ['U', 'untracked'], ['C', 'conflict']].map(function (k) { return { kind: k[0], label: k[1] }; }) };
  }
}
</script>
</body>
</html>
