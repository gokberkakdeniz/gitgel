<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Input</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&amp;display=swap">
<style>
body{margin:0}
.gg-input::placeholder{color:var(--text-muted)}
.theme-dark{--bg-sidebar:#0e0d0c;--bg-main:#141311;--bg-sunken:#1a1917;--bg-band:#1c1b18;--bg-elevated:#211f1c;--bg-track:#211f1c;--bg-hover:#2a2825;--bg-sidebar-active:#24221f;--bg-pressed:#383631;--border:#302e2a;--border-row:#262420;--border-strong:#383631;--text-strong:#faf9f5;--text-code:#e0ddd6;--text-body:#d8d4cc;--text-muted:#a09d96;--text-faint:#75726b;--text-disabled:#5c5a55;--icon-disabled:#4a4843;--accent:#4f8fa3;--accent-text:#7fb3c4;--accent-hover:#a3cad6;--on-accent:#141311;--success:#8fcf9c;--warning:#e8c071;--danger:#ee9a90;--kind-r:#93b8ee;--kind-u:#c5b2f2;--accent-rgb:79,143,163;--success-rgb:93,184,114;--warning-rgb:212,160,23;--danger-rgb:198,69,69;--kind-r-rgb:90,140,220;--kind-u-rgb:160,130,230;--shadow:rgba(0,0,0,0.45);--scrim:rgba(0,0,0,0.5)}
.theme-light{--bg-sidebar:#f1efea;--bg-main:#fbfaf7;--bg-sunken:#f4f2ee;--bg-band:#eeebe5;--bg-elevated:#ffffff;--bg-track:#e9e6e0;--bg-hover:#ebe8e1;--bg-sidebar-active:#e4e0d8;--bg-pressed:#ffffff;--border:#e2ded6;--border-row:#ebe8e2;--border-strong:#d5d0c7;--text-strong:#1d1c19;--text-code:#2b2925;--text-body:#3b3934;--text-muted:#6e6a62;--text-faint:#99958c;--text-disabled:#b7b2a9;--icon-disabled:#cbc6bd;--accent:#3a7b8f;--accent-text:#2c6a7d;--accent-hover:#1f5566;--on-accent:#ffffff;--success:#2e7a45;--warning:#8a6212;--danger:#b3463b;--kind-r:#2f63a8;--kind-u:#6a4fb5;--accent-rgb:58,123,143;--success-rgb:46,140,78;--warning-rgb:196,146,20;--danger-rgb:200,72,60;--kind-r-rgb:60,110,200;--kind-u-rgb:140,100,220;--shadow:rgba(40,32,20,0.14);--scrim:rgba(30,26,20,0.28)}
</style>
</helmet>
<div class="{{themeClass}}" style="{{boxStyle}}">
<sc-if value="{{hasLeft}}" hint-placeholder-val="{{true}}">
<span style="flex-shrink: 0; display: flex; align-items: center; color: var(--text-muted)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></span>
</sc-if>
<input class="gg-input" value="{{value}}" onChange="{{change}}" onKeyDown="{{keyDown}}" placeholder="{{placeholder}}" aria-label="{{label}}" aria-invalid="{{invalid}}" spellcheck="false" style="{{inputStyle}}">
<sc-if value="{{hasRight}}" hint-placeholder-val="{{false}}">
<span style="{{rightStyle}}">{{right}}</span>
</sc-if>
<sc-if value="{{showClear}}" hint-placeholder-val="{{false}}">
<button aria-label="Clear" title="Clear (esc)" onClick="{{clear}}" style="width: 18px; height: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 9999px; background: var(--bg-hover); color: var(--text-muted); cursor: pointer"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"value":{"editor":"text","default":""},"placeholder":{"editor":"text","default":"Search"},"label":{"editor":"text","default":"Search"},"size":{"editor":"enum","options":["28","30","32","36"],"default":"30"},"width":{"editor":"text","default":"240px"},"leftIcon":{"editor":"enum","options":["search","none"],"default":"search"},"rightIcon":{"editor":"text","default":"⌘K"},"rightKind":{"editor":"enum","options":["kbd","text"],"default":"kbd"},"mono":{"editor":"boolean","default":true},"clearable":{"editor":"boolean","default":true},"state":{"editor":"enum","options":["default","focus","invalid"],"default":"default"},"align":{"editor":"enum","options":["left","right"],"default":"left"},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"onValue":{"editor":null},"onKey":{"editor":null},"$preview":{"width":240,"height":30}}'>
class Component extends DCLogic {
  renderVals() {
    // The app's text field (src/components/Input.tsx). size: 28 beside 28px icon buttons, 30 by
    // default, 32 beside 32px header controls, 36 in forms. leftIcon / rightIcon are muted slots;
    // clearable (filters) keeps the accent border while it has text and ends with a clear button.
    var p = this.props;
    var size = Number(p.size || 30);
    var value = p.value == null ? '' : String(p.value);
    var clearable = p.clearable == null ? true : !!p.clearable;
    var mono = p.mono == null ? true : !!p.mono;
    var state = p.state || 'default';
    var filled = clearable && value.length > 0;
    var invalid = state === 'invalid';
    var ring = invalid
      ? 'border: 1px solid var(--danger); box-shadow: 0 0 0 2px rgba(var(--danger-rgb), 0.2)'
      : (state === 'focus' || filled)
        ? 'border: 1px solid var(--accent); box-shadow: 0 0 0 2px rgba(var(--accent-rgb), 0.2)'
        : 'border: 1px solid var(--border)';
    var right = p.rightIcon == null ? '⌘K' : String(p.rightIcon);
    var hasRight = right.length > 0;
    var kbd = (p.rightKind || 'kbd') === 'kbd';
    var padX = size === 36 ? 12 : 10;
    var padR = hasRight || filled ? 6 : padX;
    return {
      themeClass: p.theme === 'none' ? '' : 'theme-' + (p.theme || 'dark'),
      boxStyle: 'width: ' + (p.width || '240px') + '; height: ' + size + 'px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 ' + padR + 'px 0 ' + padX + 'px; background: var(--bg-sunken); border-radius: 8px; font-family: \'Instrument Sans\', -apple-system, sans-serif; ' + ring,
      hasLeft: (p.leftIcon || 'search') === 'search',
      value: value,
      placeholder: p.placeholder == null ? 'Search' : p.placeholder,
      label: p.label || p.placeholder || 'Search',
      invalid: invalid,
      inputStyle: 'flex-grow: 1; min-width: 0; height: 100%; padding: 0; background: transparent; border: 0; outline: none; color: var(--text-strong); ' + (mono ? 'font-family: \'JetBrains Mono\', monospace; font-size: 12px' : 'font-family: inherit; font-size: 13px') + (p.align === 'right' ? '; text-align: right' : ''),
      hasRight: hasRight,
      right: right,
      rightStyle: kbd
        ? 'flex-shrink: 0; font-family: \'JetBrains Mono\', monospace; font-size: 11px; color: var(--text-muted); background: var(--bg-hover); border-radius: 5px; padding: 1px 6px'
        : 'flex-shrink: 0; font-size: 11px; color: var(--text-muted); white-space: nowrap',
      showClear: filled,
      // Typing reports to the importer (onValue); a clearable field clears on Esc first.
      change: function (e) { if (p.onValue) p.onValue(e.target.value); },
      clear: function () { if (p.onValue) p.onValue(''); },
      keyDown: function (e) {
        if (e.key === 'Escape' && filled) { e.preventDefault(); if (p.onValue) p.onValue(''); return; }
        if (p.onKey) p.onKey(e);
      }
    };
  }
}
</script>
</body>
</html>
