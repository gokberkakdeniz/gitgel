<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>O3 · Ask before running</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&amp;display=swap">
<style>
body{margin:0;font-family:'Instrument Sans',-apple-system,sans-serif;background:#141311;color:#d8d4cc}
a{color:var(--accent-text,#7fb3c4);text-decoration:none}a:hover{color:var(--accent-hover,#a3cad6)}
button,input{font-family:inherit}
.theme-dark{--bg-main:#141311;--bg-sunken:#1a1917;--bg-elevated:#211f1c;--bg-track:#211f1c;--bg-hover:#2a2825;--bg-pressed:#383631;--border:#302e2a;--border-row:#262420;--border-strong:#383631;--text-strong:#faf9f5;--text-code:#e0ddd6;--text-body:#d8d4cc;--text-muted:#a09d96;--text-faint:#75726b;--accent:#4f8fa3;--accent-text:#7fb3c4;--accent-hover:#a3cad6;--on-accent:#141311;--accent-rgb:79,143,163;--shadow:rgba(0,0,0,0.5);--scrim:rgba(0,0,0,0.5)}
.theme-light{--bg-main:#fbfaf7;--bg-sunken:#f4f2ee;--bg-elevated:#ffffff;--bg-track:#e9e6e0;--bg-hover:#ebe8e1;--bg-pressed:#ffffff;--border:#e2ded6;--border-row:#ebe8e2;--border-strong:#d5d0c7;--text-strong:#1d1c19;--text-code:#2b2925;--text-body:#3b3934;--text-muted:#6e6a62;--text-faint:#99958c;--accent:#3a7b8f;--accent-text:#2c6a7d;--accent-hover:#1f5566;--on-accent:#ffffff;--accent-rgb:58,123,143;--shadow:rgba(40,32,20,0.18);--scrim:rgba(30,26,20,0.28)}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 1280px; height: 800px; position: relative; display: flex; justify-content: center; align-items: flex-start; background: var(--bg-main); overflow: hidden; font-size: 13px; font-family: 'Instrument Sans', -apple-system, sans-serif; color: var(--text-body)">
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 1280px; height: 800px">
<dc-import name="Main" theme="{{themeName}}" popover="none" hint-size="1280px,800px"></dc-import>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: var(--scrim)"></div>

<div role="dialog" aria-labelledby="ask-title" style="position: relative; margin-top: 180px; width: 460px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; padding: 22px 24px 18px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 24px 60px var(--shadow)">

<div id="ask-title" style="font-family: 'Source Serif 4', Georgia, serif; font-size: 22px; letter-spacing: -0.3px; color: var(--text-strong)">Run “Rebase on main…”?</div>

<div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; background: var(--bg-sunken); border: 1px solid var(--border); border-radius: 10px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-code)">
<span style="display: flex; align-items: center; gap: 10px; min-width: 0"><span style="flex-shrink: 0; display: flex; color: var(--text-muted)"><dc-import name="Icon" icon="branch" size="14" hint-size="14px,14px"></dc-import></span><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">web-app / session-token-refresh</span></span>
<span style="display: flex; align-items: center; gap: 10px; min-width: 0"><span style="flex-shrink: 0; display: flex; color: var(--text-muted)"><dc-import name="Icon" icon="folder" size="14" hint-size="14px,14px"></dc-import></span><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">~/code/web-app-wt/session-token-refresh</span></span>
</div>

<div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px">
<dc-import name="Button" theme="{{themeName}}" size="36" label="Cancel" hint-size="80px,36px"></dc-import>
<dc-import name="Button" theme="{{themeName}}" variant="primary" size="36" label="Run" kbd="⌘↵" hint-size="96px,36px"></dc-import>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["dark", "light"], "default": "dark"}, "$preview": {"width": 1280, "height": 800}}'>
class Component extends DCLogic {
renderVals() {
// "Ask before running" with no input to fill: a short confirmation (like Delete project) instead
// of the run dialog. The card says where it runs; ⌘↵ runs, Esc cancels.
var theme = this.props.theme ?? 'dark';
return { themeClass: 'theme-' + theme, themeName: theme };
}
}
</script>
</body>
</html>
