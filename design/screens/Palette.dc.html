<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add palette</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&amp;display=swap">
<style>
body{margin:0;font-family:'Instrument Sans',-apple-system,sans-serif;background:#141311;color:#d8d4cc}
a{color:#7fb3c4;text-decoration:none}a:hover{color:#a3cad6}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; background: #141311; overflow: hidden; font-size: 13px; font-family: 'Instrument Sans', -apple-system, sans-serif; color: #d8d4cc">

<div aria-hidden="true" style="position: absolute; inset: 0">
<dc-import name="Projects" variant="one" hint-size="1280px,800px"></dc-import>
</div>
<div style="position: absolute; inset: 0; background: rgba(0,0,0,0.5)"></div>

<div role="dialog" aria-label="Add branches or worktrees" style="position: absolute; left: 330px; top: 96px; width: 620px; background: #211f1c; border: 1px solid #302e2a; border-radius: 16px; box-shadow: 0 24px 60px rgba(0,0,0,0.5); display: flex; flex-direction: column; overflow: hidden">
<label style="display: flex; align-items: center; gap: 12px; padding: 0 20px; height: 56px; border-bottom: 1px solid #302e2a">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#a09d96" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search branches and worktrees</span>
<input value="token" style="flex-grow: 1; min-width: 0; background: transparent; border: 0; outline: none; color: #faf9f5; font-size: 16px">
<span style="font-size: 12px; color: #a09d96; white-space: nowrap">fuzzy · all repos</span>
</label>

<div style="display: flex; flex-direction: column; padding: 6px; max-height: 470px; overflow: hidden">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column">
<div style="padding: 10px 12px 4px; font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #a09d96">{{g.title}}</div>
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="2">
<label style="{{it.rowStyle}}">
<input type="checkbox" checked="{{it.checked}}" disabled="{{it.disabled}}" style="width: 16px; height: 16px; accent-color: #4f8fa3; margin: 0; flex-shrink: 0">
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #faf9f5">{{it.branch}}</span>
<span style="font-size: 12px; color: #a09d96">{{it.meta}}</span>
</span>
<span style="{{it.tagStyle}}">{{it.tag}}</span>
</label>
</sc-for>
</div>
</sc-for>
</div>

<div style="display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-top: 1px solid #302e2a; background: #1a1917">
<span style="font-size: 13px; color: #d8d4cc">2 selected</span>
<div style="flex-grow: 1"></div>
<button style="height: 32px; padding: 0 16px; background: #4f8fa3; border: 0; border-radius: 8px; color: #141311; font-size: 13px; font-weight: 600">Add ↵</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    var pill = function (c, bg) {
      return 'flex-shrink: 0; font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 9999px; white-space: nowrap; color: ' + c + '; background: ' + bg;
    };
    var T = {
      '': 'display: none',
      'in project': pill('#d8d4cc', '#302e2a'),
      'merged': pill('#8fcf9c', 'rgba(93,184,114,0.14)')
    };
    var row = function (b, meta, t, checked, active, tagLabel) {
      var inProject = t === 'in project';
      return {
        branch: b, meta: meta, tag: tagLabel || t, tagStyle: T[t], checked: checked, disabled: inProject,
        rowStyle: 'display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 8px; cursor: pointer; ' + (active ? 'background: #2a2825; ' : '') + (inProject ? 'opacity: 0.55; cursor: default' : '')
      };
    };
    return { groups: [
      { title: 'Worktrees', items: [
        row('token-rotation-job', 'api-server · ↑2 · 4 files · ● 1 uncommitted', '', true, true),
        row('refresh-endpoint', 'api-server · ↑3 · 6 files', '', true, false),
        row('session-token-refresh', 'web-app · already in Session auth refresh', 'in project', true, false, 'in project')
      ]},
      { title: 'Active branches', items: [
        row('feat/token-store', 'mobile · ↑5 · 8 files · 3d ago', '', false, false)
      ]},
      { title: 'Older · found by search', items: [
        row('fix/token-expiry-clock-skew', 'web-app · merged into main · 41d ago', 'merged', false, false, 'merged')
      ]}
    ] };
  }
}
</script>
</body>
</html>
