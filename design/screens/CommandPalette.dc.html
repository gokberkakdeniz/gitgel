<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Command palette</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&amp;display=swap">
<style>
body{margin:0;font-family:'Instrument Sans',-apple-system,sans-serif;background:#141311;color:#d8d4cc}
a{color:#7fb3c4;text-decoration:none}a:hover{color:#a3cad6}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; background: #141311; overflow: hidden; font-size: 13px; font-family: 'Instrument Sans', -apple-system, sans-serif; color: #d8d4cc">

<div aria-hidden="true" style="position: absolute; inset: 0">
<dc-import name="ReviewFocus" hint-size="1280px,800px"></dc-import>
</div>
<div style="position: absolute; inset: 0; background: rgba(0,0,0,0.5)"></div>

<!-- Same box as the Add palette: 620px, top 96, radius 16; search row 56px; list max 470px; no footer. -->
<div role="dialog" aria-label="{{dialogLabel}}" style="position: absolute; left: 330px; top: 96px; width: 620px; background: #211f1c; border: 1px solid #302e2a; border-radius: 16px; box-shadow: 0 24px 60px rgba(0,0,0,0.5); display: flex; flex-direction: column; overflow: hidden">
<label style="display: flex; align-items: center; gap: 12px; padding: 0 20px; height: 56px; border-bottom: 1px solid #302e2a">
<svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#a09d96" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{dialogLabel}}</span>
<input value="{{query}}" placeholder="Go to a branch or project" style="flex-grow: 1; min-width: 0; background: transparent; border: 0; outline: none; color: #faf9f5; font-size: 16px">
</label>

<div style="display: flex; flex-direction: column; padding: 6px; max-height: 470px; overflow: hidden">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column">
<sc-if value="{{g.hasLine}}" hint-placeholder-val="{{false}}"><div style="margin: 6px 12px; border-top: 1px solid #302e2a"></div></sc-if>
<sc-if value="{{g.hasTitle}}" hint-placeholder-val="{{true}}"><div style="padding: 10px 12px 4px; font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #a09d96">{{g.title}}</div></sc-if>
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="2">
<div style="{{it.rowStyle}}">
<sc-if value="{{it.isGo}}" hint-placeholder-val="{{true}}">
<!-- Places: a 14px muted kind icon (project, worktree, branch), then one line. No meta; the only title is the project on show's name above its entries, a line after them. -->
<span title="{{it.kindTitle}}" style="width: 14px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #a09d96">
<sc-if value="{{it.isProject}}" hint-placeholder-val="{{false}}"><svg role="img" aria-label="Project" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 3.5 8l8.5 4.5L20.5 8ZM3.5 12l8.5 4.5 8.5-4.5M3.5 16l8.5 4.5 8.5-4.5"></path></svg></sc-if>
<sc-if value="{{it.isWorktree}}" hint-placeholder-val="{{true}}"><svg role="img" aria-label="Worktree" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"></rect><path d="m8 10 2.5 2.5L8 15M13 15h3"></path></svg></sc-if>
<sc-if value="{{it.isBranch}}" hint-placeholder-val="{{false}}"><svg role="img" aria-label="Branch" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.2"></circle><circle cx="6" cy="18" r="2.2"></circle><circle cx="18" cy="9" r="2.2"></circle><path d="M6 8.2v7.6"></path><path d="M18 11.2c0 3-3 4.3-9.8 5"></path></svg></sc-if>
</span>
<span style="{{it.labelStyle}}"><span style="color: #a09d96">{{it.repo}}</span>{{it.label}}</span>
<sc-if value="{{it.current}}" hint-placeholder-val="{{false}}">
<svg role="img" aria-label="Open" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7fb3c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="m5 12 5 5 9-10"></path></svg>
</sc-if>
</sc-if>
<sc-if value="{{it.isHelp}}" hint-placeholder-val="{{false}}">
<!-- ?: each prefix (mono 13, accent text, 14px slot) and what it lists; picking one puts it in the search box. -->
<span style="width: 14px; flex-shrink: 0; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #7fb3c4">{{it.prefix}}</span>
<span style="flex-grow: 1; min-width: 0; font-size: 13px; color: #faf9f5">{{it.label}}</span>
</sc-if>
<sc-if value="{{it.isCommand}}" hint-placeholder-val="{{false}}">
<span style="flex-grow: 1; min-width: 0; font-size: 13px; color: #faf9f5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.label}}</span>
<sc-if value="{{it.hasKeys}}" hint-placeholder-val="{{false}}">
<kbd style="padding: 1px 6px; background: #2a2825; border-radius: 5px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #a09d96">{{it.keys}}</kbd>
</sc-if>
</sc-if>
</div>
</sc-for>
</div>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["go","search","commands","help"],"default":"go"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    var mode = this.props.mode ?? 'go';
    // Rows: 36px min, padding 7px 12px, radius 8; the active one bg.hover.
    var style = function (active) {
      return 'display: flex; align-items: center; gap: 12px; min-height: 36px; box-sizing: border-box; padding: 7px 12px; border-radius: 8px; cursor: pointer; ' + (active ? 'background: #2a2825' : '');
    };
    // kind: project | worktree | branch; repo: shown muted before a branch.
    var place = function (kind, repo, label, current, active) {
      var titles = { project: 'Project', worktree: 'Worktree', branch: 'Branch' };
      return {
        isGo: true, isCommand: false, isHelp: false, prefix: '', label: label, repo: repo ? repo + '/' : '', current: !!current, hasKeys: false, keys: '',
        isProject: kind === 'project', isWorktree: kind === 'worktree', isBranch: kind === 'branch', kindTitle: titles[kind],
        rowStyle: style(active),
        labelStyle: 'flex-grow: 1; min-width: 0; font-size: 13px; color: #faf9f5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; ' + (kind === 'project' ? '' : "font-family: 'JetBrains Mono', monospace")
      };
    };
    var cmd = function (label, keys, active) {
      return { isGo: false, isCommand: true, isHelp: false, prefix: '', label: label, repo: '', current: false, isProject: false, isWorktree: false, isBranch: false, kindTitle: '', hasKeys: !!keys, keys: keys || '', rowStyle: style(active), labelStyle: '' };
    };
    var help = function (prefix, label, active) {
      return { isGo: false, isCommand: false, isHelp: true, prefix: prefix, label: label, repo: '', current: false, isProject: false, isWorktree: false, isBranch: false, kindTitle: '', hasKeys: false, keys: '', rowStyle: style(active), labelStyle: '' };
    };
    if (mode === 'help') {
      return { dialogLabel: 'Go to Branch or Project', query: '?', groups: [
        { title: '', hasTitle: false, hasLine: false, items: [
          help('>', 'Commands', true), help('#', 'Projects', false), help('~', 'Worktrees', false), help('/', 'Branches', false)
        ]}
      ] };
    }
    if (mode === 'commands') {
      return { dialogLabel: 'Commands', query: '>', groups: [
        { title: 'Recently Used', hasTitle: true, hasLine: false, items: [cmd('Push', '', true), cmd('Unified View', '⌥V')] },
        { title: 'Review', hasTitle: true, hasLine: false, items: [cmd('Search Commits', '⌘K'), cmd('Next Change', '⌥↓'), cmd('Previous Change', '⌥↑'), cmd('Whole File', '⌥C')] },
        { title: 'Branch', hasTitle: true, hasLine: false, items: [cmd('Fetch', ''), cmd('Copy Branch Name', ''), cmd('Open in VS Code', ''), cmd('Delete Branch…', '')] },
        { title: 'Project', hasTitle: true, hasLine: false, items: [cmd('Edit Project', ''), cmd('Rename Project', '')] }
      ] };
    }
    if (mode === 'search') {
      // The project on show's entries stay on top; the rest after the line, groups together.
      return { dialogLabel: 'Go to Branch or Project', query: 'token', groups: [
        { title: 'Session auth refresh', hasTitle: true, hasLine: false, items: [
          place('worktree', 'web-app', 'session-token-refresh', true, true),
          place('worktree', 'api-server', 'token-rotation-job', false, false)
        ]},
        { title: '', hasTitle: false, hasLine: true, items: [
          place('project', '', 'Token store migration', false, false),
          place('branch', 'mobile', 'feat/token-store', false, false),
          place('branch', 'web-app', 'fix/token-expiry-clock-skew', false, false)
        ]}
      ] };
    }
    // In a project: its entries under its name, then the line and every other project and branch.
    return { dialogLabel: 'Go to Branch or Project', query: '', groups: [
      { title: 'Session auth refresh', hasTitle: true, hasLine: false, items: [
        place('worktree', 'web-app', 'session-token-refresh', true, false),
        place('worktree', 'web-app', 'logout-flow', false, true),
        place('worktree', 'api-server', 'token-rotation-job', false, false),
        place('branch', 'api-server', 'refresh-endpoint', false, false)
      ]},
      { title: '', hasTitle: false, hasLine: true, items: [
        place('project', '', 'Token store migration', false, false),
        place('project', '', 'Billing v2', false, false),
        place('worktree', 'mobile', 'feat/token-store', false, false),
        place('worktree', 'web-app', 'feature/PROJ-4821-add-retry-with-exponential-backoff', false, false),
        place('branch', 'api-server', 'rate-limit-middleware', false, false)
      ]}
    ] };
  }
}
</script>
</body>
</html>
