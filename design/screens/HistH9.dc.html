<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hi8 · Discard files</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&amp;display=swap">
<style>
body{margin:0;font-family:'Instrument Sans',-apple-system,sans-serif;background:#141311;color:#d8d4cc}
button{font-family:inherit}
.theme-dark{--bg-sidebar:#0e0d0c;--bg-main:#141311;--bg-sunken:#1a1917;--bg-band:#1c1b18;--bg-elevated:#211f1c;--bg-track:#211f1c;--bg-hover:#2a2825;--bg-sidebar-active:#24221f;--bg-pressed:#383631;--border:#302e2a;--border-row:#262420;--border-strong:#383631;--text-strong:#faf9f5;--text-code:#e0ddd6;--text-body:#d8d4cc;--text-muted:#a09d96;--text-faint:#75726b;--text-disabled:#5c5a55;--icon-disabled:#4a4843;--accent:#4f8fa3;--accent-text:#7fb3c4;--accent-hover:#a3cad6;--on-accent:#141311;--success:#8fcf9c;--warning:#e8c071;--danger:#ee9a90;--kind-r:#93b8ee;--kind-u:#c5b2f2;--accent-rgb:79,143,163;--success-rgb:93,184,114;--warning-rgb:212,160,23;--danger-rgb:198,69,69;--kind-r-rgb:90,140,220;--kind-u-rgb:160,130,230;--shadow:rgba(0,0,0,0.45);--scrim:rgba(0,0,0,0.5)}
.theme-light{--bg-sidebar:#f1efea;--bg-main:#fbfaf7;--bg-sunken:#f4f2ee;--bg-band:#eeebe5;--bg-elevated:#ffffff;--bg-track:#e9e6e0;--bg-hover:#ebe8e1;--bg-sidebar-active:#e4e0d8;--bg-pressed:#ffffff;--border:#e2ded6;--border-row:#ebe8e2;--border-strong:#d5d0c7;--text-strong:#1d1c19;--text-code:#2b2925;--text-body:#3b3934;--text-muted:#6e6a62;--text-faint:#99958c;--text-disabled:#b7b2a9;--icon-disabled:#cbc6bd;--accent:#3a7b8f;--accent-text:#2c6a7d;--accent-hover:#1f5566;--on-accent:#ffffff;--success:#2e7a45;--warning:#8a6212;--danger:#b3463b;--kind-r:#2f63a8;--kind-u:#6a4fb5;--accent-rgb:58,123,143;--success-rgb:46,140,78;--warning-rgb:196,146,20;--danger-rgb:200,72,60;--kind-r-rgb:60,110,200;--kind-u-rgb:140,100,220;--shadow:rgba(40,32,20,0.14);--scrim:rgba(30,26,20,0.28)}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 1280px; height: 800px; position: relative; display: flex; justify-content: center; align-items: flex-start; background: var(--bg-main); overflow: hidden; font-size: 13px; font-family: 'Instrument Sans', -apple-system, sans-serif; color: var(--text-body)">
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 1280px; height: 800px">
<dc-import name="HistH6" theme="{{themeName}}" selected="{{selected}}" hint-size="1280px,800px"></dc-import>
</div>
<sc-if value="{{isMenu}}" hint-placeholder-val="{{true}}">
<div style="{{menuPos}}"><dc-import name="Menu" theme="{{themeName}}" width="230" label="{{menuLabel}}" items="{{fileMenu}}" hint-size="230px,340px"></dc-import></div>
</sc-if>
<sc-if value="{{isConfirm}}" hint-placeholder-val="{{false}}">
<div aria-hidden="true" style="position: absolute; inset: 0; background: var(--scrim)"></div>
<div role="alertdialog" aria-labelledby="discard-title" style="position: relative; margin-top: 160px; width: 480px; display: flex; flex-direction: column; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 24px 60px var(--shadow); overflow: hidden">
<dc-import name="ModalHeader" theme="{{themeName}}" title="{{title}}" sub="" close="{{true}}" title-id="discard-title" hint-size="100%,64px"></dc-import>
<div style="display: flex; gap: 16px; padding: 4px 24px 22px">
<span style="flex-shrink: 0; display: flex"><dc-import name="Icon" icon="warning" size="28" stroke="1.6" color="var(--warning)" hint-size="28px,28px"></dc-import></span>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: var(--text-body)">{{lead}}</p>
<sc-if value="{{hasList}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{files}}" as="f" hint-placeholder-count="2">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-code); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{f.path}}</span>
</sc-for>
</div>
</sc-if>
<p style="margin: 0; font-size: 13px; line-height: 1.5; color: var(--text-muted)">Changes can be restored by retrieving them from the Trash.</p>
<sc-if value="{{hasList}}" hint-placeholder-val="{{true}}">
<dc-import name="Checkbox" theme="none" checked="{{false}}" label="Do not show this message again" hint-size="140px,20px"></dc-import>
</sc-if>
</div>
</div>
<dc-import name="ModalFooter" theme="{{themeName}}" note="" buttons="{{buttons}}" hint-size="100%,64px"></dc-import>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"step":{"editor":"enum","options":["menu","confirm"],"default":"confirm"},"count":{"editor":"enum","options":["two","one","all"],"default":"two"},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    var t = this.props.theme || 'dark';
    var step = this.props.step || 'menu';
    var count = this.props.count || 'two';
    var two = count === 'two', all = count === 'all';
    // History, Uncommitted picked (Hi5). ⌘-click / ⇧-click picks several of its files (tinted; the
    // diff keeps the file it shows); a plain click picks just that one again, esc clears.
    // Right-click on a picked file acts on all picked ones; on any other file, on that file alone
    // (count one). The menu: Include / Exclude (the boxes, git's index), copy paths, the open items
    // (D11); Discard first. Texts as GitHub Desktop's. Only Uncommitted's files; a commit's or a stash's keep D11's menu.
    // Discard asks first (a Modal with a ✕, Cancel focused; esc cancels). As GitHub Desktop: a copy
    // of each file's working copy goes to the Trash first, named "<file name> <HH-mm-ss-SSS><ext>"
    // (x1.txt → "x1.txt 20-42-56-018.txt"); if that fails nothing is discarded. Then it goes back
    // to HEAD, staged and unstaged alike (git restore --source=HEAD --staged --worktree --
    // <paths>); an untracked file is removed after its copy; a deleted file has nothing to copy;
    // a staged rename also loses its new path. "Do not show this message again" skips the dialog from then on (Settings turns it back on).
    // count all: right-click (or ⋯) on the Uncommitted row: Discard All Changes… and Stash All Changes…. It, or
    // more than 10 files picked, asks with the count only: no list, no "Do not show this message again" (it always
    // asks).
    var files = all
      ? [{ name: 'refresh.ts', path: 'src/auth/refresh.ts' }, { name: 'refresh.test.ts', path: 'test/auth/refresh.test.ts' }, { name: 'token-debug.ts', path: 'scripts/token-debug.ts', untracked: true }]
      : two
      ? [{ name: 'refresh.ts', path: 'src/auth/refresh.ts', stat: '+2 −1' }, { name: 'token-debug.ts', path: 'scripts/token-debug.ts', stat: '+22', untracked: true }]
      : [{ name: 'refresh.test.ts', path: 'test/auth/refresh.test.ts', stat: '+5' }];
    var n = files.length;
    var many = function (one, more) { return n === 1 ? one : more.replace('#', n); };
    var untracked = files.filter(function (f) { return f.untracked; });
    return {
      themeClass: 'theme-' + t, themeName: t,
      selected: two ? files.map(function (f) { return f.name; }) : [],
      isMenu: step === 'menu', isConfirm: step === 'confirm',
      menuPos: 'position: absolute; left: 196px; top: ' + (all ? 130 : two ? 260 : 230) + 'px; z-index: 5',
      menuLabel: all ? 'Uncommitted Changes Actions' : many(files[0].name + ' actions', '# files actions'),
      fileMenu: all ? [
        { label: 'Discard All Changes…', danger: true, active: true },
        { label: 'Stash All Changes…', icon: 'package' }
      ] : n === 1 ? [
        { label: 'Discard Changes…', danger: true, active: true },
        { kind: 'sep' },
        { label: 'Copy File Path', icon: 'copy' },
        { label: 'Copy Relative File Path', icon: 'copy' },
        { kind: 'sep' },
        { label: 'Open in Finder', app: 'finder' },
        { label: 'Open in Cursor', app: 'cursor' },
        { label: 'Open in VS Code', app: 'vscode' }
      ] : [
        { label: 'Discard ' + n + ' Selected Changes…', danger: true, active: true },
        { kind: 'sep' },
        { label: 'Include Selected Files', icon: 'check' },
        { label: 'Exclude Selected Files', icon: 'close' },
        { kind: 'sep' },
        { label: 'Copy Paths', icon: 'copy' },
        { label: 'Copy Relative Paths', icon: 'copy' },
        { kind: 'sep' },
        { label: 'Open in Finder', app: 'finder' },
        { label: 'Open in Cursor', app: 'cursor' },
        { label: 'Open in VS Code', app: 'vscode' }
      ],
      hasList: !all && n <= 10,
      title: all ? 'Confirm Discard All Changes' : 'Confirm Discard Changes',
      lead: all || n > 10 ? 'Are you sure you want to discard all ' + n + ' changed files?' : 'Are you sure you want to discard all changes to:',
      files: files.map(function (f) { return { path: f.path }; }),
      buttons: [{ label: 'Cancel' }, { label: all ? 'Discard All Changes' : 'Discard Changes', variant: 'danger' }]
    };
  }
}
</script>
</body>
</html>
