<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stepper</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&amp;display=swap">
<style>
body{margin:0}
.theme-dark{--bg-sidebar:#0e0d0c;--bg-main:#141311;--bg-sunken:#1a1917;--bg-band:#1c1b18;--bg-elevated:#211f1c;--bg-track:#211f1c;--bg-hover:#2a2825;--bg-sidebar-active:#24221f;--bg-pressed:#383631;--border:#302e2a;--border-row:#262420;--border-strong:#383631;--text-strong:#faf9f5;--text-code:#e0ddd6;--text-body:#d8d4cc;--text-muted:#a09d96;--text-faint:#75726b;--text-disabled:#5c5a55;--icon-disabled:#4a4843;--accent:#4f8fa3;--accent-text:#7fb3c4;--accent-hover:#a3cad6;--on-accent:#141311;--success:#8fcf9c;--warning:#e8c071;--danger:#ee9a90;--kind-r:#93b8ee;--kind-u:#c5b2f2;--accent-rgb:79,143,163;--success-rgb:93,184,114;--warning-rgb:212,160,23;--danger-rgb:198,69,69;--kind-r-rgb:90,140,220;--kind-u-rgb:160,130,230;--shadow:rgba(0,0,0,0.45);--scrim:rgba(0,0,0,0.5)}
.theme-light{--bg-sidebar:#f1efea;--bg-main:#fbfaf7;--bg-sunken:#f4f2ee;--bg-band:#eeebe5;--bg-elevated:#ffffff;--bg-track:#e9e6e0;--bg-hover:#ebe8e1;--bg-sidebar-active:#e4e0d8;--bg-pressed:#ffffff;--border:#e2ded6;--border-row:#ebe8e2;--border-strong:#d5d0c7;--text-strong:#1d1c19;--text-code:#2b2925;--text-body:#3b3934;--text-muted:#6e6a62;--text-faint:#99958c;--text-disabled:#b7b2a9;--icon-disabled:#cbc6bd;--accent:#3a7b8f;--accent-text:#2c6a7d;--accent-hover:#1f5566;--on-accent:#ffffff;--success:#2e7a45;--warning:#8a6212;--danger:#b3463b;--kind-r:#2f63a8;--kind-u:#6a4fb5;--accent-rgb:58,123,143;--success-rgb:46,140,78;--warning-rgb:196,146,20;--danger-rgb:200,72,60;--kind-r-rgb:60,110,200;--kind-u-rgb:140,100,220;--shadow:rgba(40,32,20,0.14);--scrim:rgba(30,26,20,0.28)}
</style>
</helmet>
<span class="{{themeClass}}" style="display: contents">
<span role="group" aria-label="{{label}}" style="flex-shrink: 0; display: inline-flex; gap: 2px; padding: 2px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 8px">
<button type="button" onClick="{{up}}" disabled="{{upDisabled}}" aria-label="{{upLabel}}" title="{{upTitle}}" style="{{upStyle}}"><dc-import name="Icon" icon="chevron-up" size="14" stroke="2" hint-size="14px,14px"></dc-import></button>
<button type="button" onClick="{{down}}" disabled="{{downDisabled}}" aria-label="{{downLabel}}" title="{{downTitle}}" style="{{downStyle}}"><dc-import name="Icon" icon="chevron-down" size="14" stroke="2" hint-size="14px,14px"></dc-import></button>
</span>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["changes","commits"],"default":"changes"},"upDisabled":{"editor":"boolean","default":false},"downDisabled":{"editor":"boolean","default":false},"upCross":{"editor":"boolean","default":false},"downCross":{"editor":"boolean","default":false},"theme":{"editor":"enum","options":["dark","light","none"],"default":"dark"},"label":{"editor":null},"upLabel":{"editor":null},"upTitle":{"editor":null},"downLabel":{"editor":null},"downTitle":{"editor":null},"onUp":{"editor":null},"onDown":{"editor":null},"$preview":{"width":60,"height":30}}'>
class Component extends DCLogic {
  renderVals() {
    // The app's Stepper (src/components/Stepper.tsx): ↑ ↓ in one framed group. kind changes:
    // "Jump between changes" in the file bar (D4); commits: "Step through commits" in the entry bar
    // (D7). Cross: the step leaves the current file for the next one, tinted accent.
    var p = this.props;
    var commits = p.kind === 'commits';
    var btn = function (off, cross) {
      return 'width: 26px; height: 24px; display: flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 6px; cursor: pointer; ' +
        (off ? 'background: transparent; color: var(--icon-disabled); cursor: default' : cross ? 'background: rgba(var(--accent-rgb), 0.18); color: var(--accent-hover)' : 'background: transparent; color: var(--text-body)');
    };
    var call = function (f) { return f ? function (e) { f(e); } : undefined; };
    return {
      themeClass: p.theme === 'none' ? '' : 'theme-' + (p.theme || 'dark'),
      label: p.label || (commits ? 'Step through commits' : 'Jump between changes'),
      upLabel: p.upLabel || (commits ? 'Newer commit' : 'Previous change'),
      downLabel: p.downLabel || (commits ? 'Older commit' : 'Next change'),
      upTitle: p.upTitle || (commits ? 'Newer commit (⌥⇧↑)' : 'Previous change (⌥↑)'),
      downTitle: p.downTitle || (commits ? 'Older commit (⌥⇧↓)' : 'Next change (⌥↓)'),
      upDisabled: !!p.upDisabled, downDisabled: !!p.downDisabled,
      upStyle: btn(!!p.upDisabled, !!p.upCross), downStyle: btn(!!p.downDisabled, !!p.downCross),
      up: call(p.onUp), down: call(p.onDown)
    };
  }
}
</script>
</body>
</html>
