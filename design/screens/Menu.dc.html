<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&amp;display=swap">
<style>
body{margin:0}
.theme-dark{--bg-sidebar:#0e0d0c;--bg-main:#141311;--bg-sunken:#1a1917;--bg-band:#1c1b18;--bg-elevated:#211f1c;--bg-track:#211f1c;--bg-hover:#2a2825;--bg-sidebar-active:#24221f;--bg-pressed:#383631;--border:#302e2a;--border-row:#262420;--border-strong:#383631;--text-strong:#faf9f5;--text-code:#e0ddd6;--text-body:#d8d4cc;--text-muted:#a09d96;--text-faint:#75726b;--text-disabled:#5c5a55;--icon-disabled:#4a4843;--accent:#4f8fa3;--accent-text:#7fb3c4;--accent-hover:#a3cad6;--on-accent:#141311;--success:#8fcf9c;--warning:#e8c071;--danger:#ee9a90;--danger-fill:#c64545;--accent-rgb:79,143,163;--success-rgb:93,184,114;--warning-rgb:212,160,23;--danger-rgb:198,69,69;--shadow:rgba(0,0,0,0.45);--scrim:rgba(0,0,0,0.5)}
.theme-light{--bg-sidebar:#f1efea;--bg-main:#fbfaf7;--bg-sunken:#f4f2ee;--bg-band:#eeebe5;--bg-elevated:#ffffff;--bg-track:#e9e6e0;--bg-hover:#ebe8e1;--bg-sidebar-active:#e4e0d8;--bg-pressed:#ffffff;--border:#e2ded6;--border-row:#ebe8e2;--border-strong:#d5d0c7;--text-strong:#1d1c19;--text-code:#2b2925;--text-body:#3b3934;--text-muted:#6e6a62;--text-faint:#99958c;--text-disabled:#b7b2a9;--icon-disabled:#cbc6bd;--accent:#3a7b8f;--accent-text:#2c6a7d;--accent-hover:#1f5566;--on-accent:#ffffff;--success:#2e7a45;--warning:#8a6212;--danger:#b3463b;--danger-fill:#c64545;--accent-rgb:58,123,143;--success-rgb:46,140,78;--warning-rgb:196,146,20;--danger-rgb:200,72,60;--shadow:rgba(40,32,20,0.14);--scrim:rgba(30,26,20,0.28)}
</style>
</helmet>
<div role="menu" aria-label="{{label}}" class="{{themeClass}}" style="{{boxStyle}}">
<sc-for list="{{rows}}" as="m" hint-placeholder-count="6">
<sc-if value="{{m.isItem}}" hint-placeholder-val="{{true}}">
<dc-import name="MenuItem" theme="none" label="{{m.label}}" lead="{{m.lead}}" icon="{{m.icon}}" app="{{m.app}}" checked="{{m.on}}" sub="{{m.sub}}" desc="{{m.desc}}" aside="{{m.aside}}" kbd="{{m.kbd}}" arrow="{{m.arrow}}" submenu="{{m.submenu}}" tone="{{m.tone}}" active="{{m.active}}" disabled="{{m.disabled}}" href="{{m.href}}" role="{{m.role}}" title="{{m.title}}" on-select="{{m.onSelect}}" hint-size="100%,33px"></dc-import>
</sc-if>
<sc-if value="{{m.isSep}}" hint-placeholder-val="{{false}}">
<div role="separator" style="height: 1px; margin: 4px; background: var(--border)"></div>
</sc-if>
<sc-if value="{{m.isLabel}}" hint-placeholder-val="{{false}}">
<div style="padding: 6px 10px 4px; font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted)">{{m.label}}</div>
</sc-if>
<sc-if value="{{m.isNote}}" hint-placeholder-val="{{false}}">
<div style="display: flex; align-items: flex-start; gap: 8px; padding: 6px 10px 4px; font-size: 12px; line-height: 1.45; color: var(--warning)"><span style="flex-shrink: 0; margin-top: 1px; display: flex"><dc-import name="Icon" icon="info" size="14" hint-size="14px,14px"></dc-import></span><span>{{m.label}}</span></div>
</sc-if>
<sc-if value="{{m.isCaption}}" hint-placeholder-val="{{false}}">
<div style="padding: 6px 10px 4px; font-size: 11px; color: var(--text-faint)">{{m.label}}</div>
</sc-if>
<sc-if value="{{m.isSeg}}" hint-placeholder-val="{{false}}">
<div role="group" aria-label="{{m.label}}" style="{{m.style}}">
<span style="flex-grow: 1; font-size: 12px; color: var(--text-muted)">{{m.label}}</span>
<dc-import name="Segmented" theme="none" size="xs" options="{{m.options}}" label="{{m.label}}" hint-size="96px,26px"></dc-import>
</div>
</sc-if>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"width":{"editor":"int","default":260},"theme":{"editor":"enum","options":["dark","light","none"],"default":"dark"},"items":{"editor":null},"label":{"editor":null},"$preview":{"width":260,"height":260}}'>
class Component extends DCLogic {
  renderVals() {
    // The app's Menu (src/components/Menu.tsx): bg.elevated, radius 12, padding 6, popover shadow;
    // the importer positions it. items, top to bottom:
    //   { label, icon? | app? | check? | box? | dot?, sub?, desc?, hint?, kbd?, arrow?, submenu?, active?,
    //     disabled?, danger?, accent?, href?, onSelect?, role? }   an item (active = hovered)
    //   { kind: 'sep' } · { kind: 'label', label } (section heading) · { kind: 'note', label }
    //   (the warning closing the menu, after a sep) · { kind: 'caption', label } · { kind: 'segmented', label,
    //   options, disabled? } (a choice under the item above, e.g. Lines around changes).
    // Each item is a MenuItem (its own artboard): icon (a name of the Icon set), app (finder,
    // cursor, vscode, terminal), check (radio slot, true / false), box (checkbox), dot ('on' / 'off');
    // hint becomes its aside.
    var p = this.props;
    var sample = [
      { label: 'Copy Branch Name', icon: 'copy', active: true }, { kind: 'sep' },
      { label: 'Open in Finder', app: 'finder' }, { label: 'Open in Cursor', app: 'cursor' }, { label: 'Open in Terminal', app: 'terminal' },
      { kind: 'sep' }, { label: 'Remove from project', icon: 'remove', danger: true },
      { kind: 'sep' }, { kind: 'note', label: 'Not checked out' }
    ];
    var font = 'font-family: \'Instrument Sans\', -apple-system, sans-serif; ';
    // Like the app: a group left empty takes its divider with it (none at either end or twice in a row).
    var list = (p.items || sample).filter(function (it, i, all) {
      if (it.kind !== 'sep') return true;
      var prev = all.slice(0, i).filter(function (x) { return x.kind !== 'sep'; }).length;
      var next = all[i + 1];
      return prev > 0 && next && next.kind !== 'sep';
    });
    var rows = list.map(function (it) {
      var k = it.kind || 'item';
      if (k !== 'item') {
        return {
          isSep: k === 'sep', isLabel: k === 'label', isNote: k === 'note', isCaption: k === 'caption', isSeg: k === 'segmented',
          label: it.label || '', options: it.options,
          style: 'display: flex; align-items: center; gap: 10px; padding: 0 10px 6px 36px;' + (it.disabled ? ' opacity: 0.45; pointer-events: none;' : '')
        };
      }
      var hasCheck = it.check === true || it.check === false;
      var hasBox = it.box === true || it.box === false;
      var lead = it.icon ? 'icon' : it.app ? 'app' : hasCheck ? 'check' : hasBox ? 'box' : it.dot ? 'dot' : 'none';
      return {
        isItem: true, label: it.label, lead: lead, icon: it.icon || 'copy', app: it.app || 'finder',
        on: hasCheck ? it.check : hasBox ? it.box : it.dot === 'on',
        sub: it.sub || '', desc: it.desc || '', aside: it.hint || '', kbd: it.kbd || '', arrow: !!it.arrow, submenu: !!it.submenu,
        tone: it.danger ? 'danger' : it.accent ? 'accent' : 'default',
        active: !!it.active, disabled: !!it.disabled, href: it.href, role: it.role, title: it.title, onSelect: it.onSelect
      };
    });
    return {
      themeClass: p.theme === 'none' ? '' : 'theme-' + (p.theme || 'dark'),
      label: p.label || 'Menu',
      boxStyle: 'box-sizing: border-box; width: ' + (p.width || 260) + 'px; display: flex; flex-direction: column; padding: 6px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 16px 40px var(--shadow); ' + font + 'font-size: 13px; color: var(--text-body)',
      rows: rows
    };
  }
}
</script>
</body>
</html>
