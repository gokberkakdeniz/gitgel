<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>N6 · New script</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&amp;display=swap">
<style>
body{margin:0;font-family:'Instrument Sans',-apple-system,sans-serif;background:#141311;color:#d8d4cc}
a{color:var(--accent-text,#7fb3c4);text-decoration:none}a:hover{color:var(--accent-hover,#a3cad6)}
button,input,textarea{font-family:inherit}
.theme-dark{--bg-main:#141311;--bg-sunken:#1a1917;--bg-elevated:#211f1c;--bg-track:#211f1c;--bg-hover:#2a2825;--bg-pressed:#383631;--border:#302e2a;--border-row:#262420;--border-strong:#383631;--text-strong:#faf9f5;--text-code:#e0ddd6;--text-body:#d8d4cc;--text-muted:#a09d96;--text-faint:#75726b;--accent:#4f8fa3;--accent-text:#7fb3c4;--accent-hover:#a3cad6;--on-accent:#141311;--accent-rgb:79,143,163;--warning:#e8c071;--success:#8fcf9c;--danger:#ee9a90;--danger-rgb:198,69,69;--shadow:rgba(0,0,0,0.5);--scrim:rgba(0,0,0,0.5)}
.theme-light{--bg-main:#fbfaf7;--bg-sunken:#f4f2ee;--bg-elevated:#ffffff;--bg-track:#e9e6e0;--bg-hover:#ebe8e1;--bg-pressed:#ffffff;--border:#e2ded6;--border-row:#ebe8e2;--border-strong:#d5d0c7;--text-strong:#1d1c19;--text-code:#2b2925;--text-body:#3b3934;--text-muted:#6e6a62;--text-faint:#99958c;--accent:#3a7b8f;--accent-text:#2c6a7d;--accent-hover:#1f5566;--on-accent:#ffffff;--accent-rgb:58,123,143;--warning:#8a6212;--success:#2e7a45;--danger:#b3463b;--danger-rgb:200,72,60;--shadow:rgba(40,32,20,0.18);--scrim:rgba(30,26,20,0.28)}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 1280px; height: 1600px; position: relative; display: flex; justify-content: center; align-items: flex-start; background: var(--bg-main); overflow: hidden; font-size: 13px; font-family: 'Instrument Sans', -apple-system, sans-serif; color: var(--text-body)">
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 1280px; height: 800px">
<dc-import name="Settings" theme="{{themeName}}" section="scripts" hint-size="1280px,800px"></dc-import>
</div>
<div aria-hidden="true" style="position: absolute; inset: 0; background: var(--scrim)"></div>

<div role="dialog" aria-labelledby="ns-title" style="position: relative; margin-top: 110px; width: 600px; display: flex; flex-direction: column; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 24px 60px var(--shadow); overflow: hidden">

<dc-import name="ModalHeader" theme="{{themeName}}" title="New Script" sub="" close="{{true}}" title-id="ns-title" hint-size="100%,64px"></dc-import>

<div style="display: flex; flex-direction: column; gap: 18px; padding: 4px 24px 22px">

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="color: var(--text-strong); font-weight: 500">Name</span>
<div style="position: relative; z-index: 3">
<div style="height: 36px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 3px; background: var(--bg-sunken); border: 1px solid var(--border); border-radius: 8px">
<button onClick="{{toggleIcons}}" aria-haspopup="listbox" aria-expanded="{{iconOpen}}" aria-label="{{iconBtnLabel}}" title="Icon" style="{{iconBtnStyle}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{iconD}}"></path></svg><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted)"><path d="m6 9 6 6 6-6"></path></svg></button>
<span style="flex-grow: 1; min-width: 0; color: var(--text-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Start dev server</span>
<button aria-haspopup="menu" title="Insert a variable ({branch}, {base}, {repo})" style="{{nameVarStyle}}">Add Variable<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></button>
</div>
<sc-if value="{{iconOpen}}" hint-placeholder-val="{{false}}">
<div role="listbox" aria-label="Icon" style="position: absolute; top: 40px; left: 0; width: 264px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; padding: 10px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 16px 40px var(--shadow)">
<span style="padding: 0 2px; font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted)">Icon</span>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px">
<sc-for list="{{icons}}" as="ic" hint-placeholder-count="18">
<button role="option" aria-selected="{{ic.on}}" aria-label="{{ic.label}}" title="{{ic.label}}" onClick="{{ic.pick}}" style="{{ic.style}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{ic.d}}"></path></svg></button>
</sc-for>
</div>
</div>
</sc-if>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: baseline; justify-content: space-between"><label for="ns-cmd" style="color: var(--text-strong); font-weight: 500">Command</label></div>
<div style="position: relative; z-index: 2; display: flex; flex-direction: column">
<textarea id="ns-cmd" rows="3" title="Grows with the command; drag the corner to make it taller" style="box-sizing: border-box; resize: vertical; overflow-y: auto; max-height: 360px; padding: 10px 92px 10px 12px; background: var(--bg-sunken); border: 1px solid var(--accent); box-shadow: 0 0 0 2px rgba(var(--accent-rgb), 0.2); border-radius: 8px; color: var(--text-code); font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 20px; outline: none">pnpm install --frozen-lockfile
PORT="$GITGEL_INPUT_PORT" API_URL="${GITGEL_INPUT_API:-mock}" pnpm dev</textarea>
<button onClick="{{toggleCmdInsert}}" aria-haspopup="menu" aria-expanded="{{cmdOpen}}" title="Insert a Variable" style="{{cmdBtnStyle}}">Add Variable<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></button>
<sc-if value="{{cmdOpen}}" hint-placeholder-val="{{false}}">
<div role="menu" aria-label="Insert a Variable" style="position: absolute; top: 38px; right: 6px; width: 300px; box-sizing: border-box; display: flex; flex-direction: column; padding: 6px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 16px 40px var(--shadow)">
<sc-for list="{{vars}}" as="v" hint-placeholder-count="8">
<button role="menuitem" onClick="{{closeInsert}}" style="display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 10px; background: transparent; border: 0; border-radius: 8px; text-align: left; cursor: pointer"><span style="flex-grow: 1; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--accent-text)">{{v.name}}</span><span style="font-size: 12px; color: var(--text-muted)">{{v.note}}</span></button>
</sc-for>
</div>
</sc-if>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: baseline; justify-content: space-between"><span id="ns-inputs" style="color: var(--text-strong); font-weight: 500">Inputs</span></div>
<ul aria-labelledby="ns-inputs" style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; background: var(--bg-sunken); border: 1px solid var(--border); border-radius: 12px; overflow: hidden">
<sc-for list="{{inputs}}" as="in" hint-placeholder-count="3">
<li style="display: flex; flex-direction: column; border-bottom: 1px solid var(--border)">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px 0 6px; min-height: 44px">
<span aria-hidden="true" style="width: 14px; display: flex; justify-content: center; color: var(--text-faint)"><svg width="10" height="14" viewBox="0 0 10 14" fill="currentColor"><circle cx="2.5" cy="2.5" r="1.2"></circle><circle cx="7.5" cy="2.5" r="1.2"></circle><circle cx="2.5" cy="7" r="1.2"></circle><circle cx="7.5" cy="7" r="1.2"></circle><circle cx="2.5" cy="11.5" r="1.2"></circle><circle cx="7.5" cy="11.5" r="1.2"></circle></svg></span>
<button aria-expanded="{{in.open}}" onClick="{{in.toggle}}" style="flex-grow: 1; min-width: 0; height: 44px; display: flex; align-items: center; gap: 10px; padding: 0; background: transparent; border: 0; text-align: left; color: var(--text-strong); font-size: 13px; cursor: pointer">
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="{{in.chevronStyle}}"><path d="m9 6 6 6-6 6"></path></svg>
<span style="width: 64px; flex-shrink: 0; height: 20px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border-strong); border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-muted)">{{in.type}}</span>
<span style="font-weight: 500">{{in.label}}</span>
<span style="flex-grow: 1; min-width: 0; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--accent-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">$GITGEL_INPUT_{{in.id}}</span>
<sc-if value="{{in.hasWhen}}" hint-placeholder-val="{{false}}"><dc-import name="Pill" theme="{{themeName}}" label="when" tone="neutral" size="sm" hint-size="44px,16px"></dc-import></sc-if>
</button>
<dc-import name="Button" theme="{{themeName}}" variant="ghost" size="28" icon="close" label="" aria-label="{{in.removeLabel}}" hint-size="28px,28px"></dc-import>
</div>
<sc-if value="{{in.open}}" hint-placeholder-val="{{false}}">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; padding: 4px 16px 16px 36px">
<div style="display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--text-muted)"><span>Label</span><dc-import name="Input" theme="{{themeName}}" size="32" width="100%" value="{{in.label}}" label="Label" left-icon="none" right-text="" mono="{{false}}" clearable="{{false}}" hint-size="100%,32px"></dc-import></div>
<div style="display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--text-muted)"><span>ID</span><dc-import name="Input" theme="{{themeName}}" size="32" width="100%" value="{{in.id}}" label="ID" left-icon="none" right-text="" clearable="{{false}}" hint-size="100%,32px"></dc-import></div>
<div style="display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--text-muted)"><span>Type</span><dc-import name="Select" theme="{{themeName}}" size="32" width="100%" value="{{in.typeLabel}}" label="Type" hint-size="100%,32px"></dc-import></div>
<div style="display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--text-muted)"><span>Default</span><dc-import name="Input" theme="{{themeName}}" size="32" width="100%" value="{{in.def}}" label="Default" left-icon="none" right-text="" mono="{{false}}" clearable="{{false}}" hint-size="100%,32px"></dc-import></div>
<sc-if value="{{in.isSelect}}" hint-placeholder-val="{{false}}">
<label style="grid-column: 1 / -1; display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--text-muted)"><span style="display: flex; justify-content: space-between">Options<span>One per line. 4 or fewer show as buttons.</span></span><textarea rows="3" style="box-sizing: border-box; resize: none; padding: 8px 10px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 8px; color: var(--text-code); font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 18px; outline: none" value="{{in.options}}"></textarea></label>
</sc-if>
<div style="grid-column: 1 / -1; display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--text-muted)"><span style="display: flex; justify-content: space-between">Show when<span>Can use branch and the inputs above</span></span><span style="position: relative; display: flex; flex-direction: column"><textarea rows="2" aria-label="Show when" placeholder="Always" style="box-sizing: border-box; resize: none; padding: 8px 92px 8px 10px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 8px; color: var(--text-code); font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 18px; outline: none" value="{{in.when}}"></textarea><button aria-haspopup="menu" title="Insert a field (branch fields and the inputs above, e.g. inputs.mock)" style="{{inBtnStyle}}">Add Variable<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></button></span></div>
<sc-if value="{{in.hasWhen}}" hint-placeholder-val="{{false}}">
<span style="grid-column: 1 / -1; margin-top: -6px; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted)"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--success)"><path d="m5 12 5 5 9-10"></path></svg>{{in.whenResult}}</span>
</sc-if>
<div style="grid-column: 1 / -1; justify-self: start"><dc-import name="Checkbox" theme="{{themeName}}" checked="{{in.required}}" label="Required" hint-size="100px,16px"></dc-import></div>
</div>
</sc-if>
</li>
</sc-for>
<li style="display: flex; padding: 12px 14px"><dc-import name="Button" theme="{{themeName}}" variant="link" label="Add Input" hint-size="90px,16px"></dc-import></li>
</ul>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<div role="radiogroup" aria-labelledby="ns-where" style="display: flex; flex-direction: column; gap: 8px">
<span id="ns-where" style="color: var(--text-strong); font-weight: 500">Runs in</span>
<button role="radio" aria-checked="true" style="display: flex; align-items: flex-start; gap: 10px; padding: 0; background: transparent; border: 0; text-align: left; color: var(--text-body); font-size: 13px"><span style="width: 16px; height: 16px; flex-shrink: 0; box-sizing: border-box; border-radius: 50%; border: 5px solid var(--accent)"></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="color: var(--text-strong)">Worktree Folder</span><span style="font-size: 12px; color: var(--text-muted)">Hidden when the branch is not checked out</span></span></button>
<button role="radio" aria-checked="false" style="display: flex; align-items: flex-start; gap: 10px; padding: 0; background: transparent; border: 0; text-align: left; color: var(--text-body); font-size: 13px"><span style="width: 16px; height: 16px; flex-shrink: 0; box-sizing: border-box; border-radius: 50%; border: 1.5px solid var(--border-strong)"></span><span style="display: flex; flex-direction: column; gap: 2px"><span style="color: var(--text-strong)">Repository Folder</span><span style="font-size: 12px; color: var(--text-muted)">Always available</span></span></button>
</div>
<div role="group" aria-labelledby="ns-show" style="display: flex; flex-direction: column; gap: 8px">
<span id="ns-show" style="color: var(--text-strong); font-weight: 500">Show in</span>
<dc-import name="Checkbox" theme="{{themeName}}" checked="{{true}}" label="Branches Row Menu" hint-size="160px,16px"></dc-import>
<dc-import name="Checkbox" theme="{{themeName}}" checked="{{false}}" label="Project Entry Menu" hint-size="160px,16px"></dc-import>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: baseline; justify-content: space-between"><label for="ns-when" style="color: var(--text-strong); font-weight: 500">Show when</label><span style="font-size: 12px; color: var(--text-muted)">A CEL expression. Empty shows it always.</span></div>
<div style="position: relative; z-index: 1; display: flex; flex-direction: column">
<textarea id="ns-when" rows="2" placeholder="branch.ahead &gt; 0 &amp;&amp; !branch.merged" aria-invalid="{{whenInvalid}}" aria-describedby="ns-when-result" style="{{whenStyle}}" value="{{whenExpr}}"></textarea>
<button onClick="{{toggleWhenInsert}}" aria-haspopup="menu" aria-expanded="{{whenOpen}}" title="Insert a Field" style="{{whenBtnStyle}}">Add Variable<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></button>
<sc-if value="{{whenOpen}}" hint-placeholder-val="{{false}}">
<div role="menu" aria-label="Insert a Field" style="position: absolute; top: 38px; right: 6px; width: 320px; box-sizing: border-box; display: flex; flex-direction: column; padding: 6px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 16px 40px var(--shadow)">
<sc-for list="{{fields}}" as="f" hint-placeholder-count="11">
<button role="menuitem" onClick="{{closeInsert}}" style="display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 10px; background: transparent; border: 0; border-radius: 8px; text-align: left; cursor: pointer"><span style="flex-grow: 1; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--accent-text)">{{f.name}}</span><span style="font-size: 12px; color: var(--text-muted)">{{f.type}}</span></button>
</sc-for>
</div>
</sc-if>
</div>
<div id="ns-when-result" style="{{resultStyle}}">
<sc-if value="{{whenOk}}" hint-placeholder-val="{{true}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; color: var(--success)"><path d="m5 12 5 5 9-10"></path></svg></sc-if>
<sc-if value="{{whenInvalid}}" hint-placeholder-val="{{false}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="flex-shrink: 0; color: var(--danger)"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6"></path><path d="M12 16.5h.01"></path></svg></sc-if>
<span>{{resultText}}</span>
</div>
</div>

<dc-import name="Checkbox" theme="{{themeName}}" card="{{true}}" checked="{{openOutput}}" label="Open the output panel automatically" sub="Every run shows a toast; click it for the output, to answer prompts or to stop the script. Turn this on to open the output as soon as it starts (long jobs, scripts that ask questions)." on-toggle="{{toggleOpenOutput}}" hint-size="100%,64px"></dc-import>

<dc-import name="Checkbox" theme="{{themeName}}" card="{{true}}" checked="{{false}}" label="Ask before running" sub="Opens the run dialog first, even without inputs, so nothing runs on one click. Turn it on for scripts that change the branch (rebase, push, reset)." hint-size="100%,64px"></dc-import>

</div>

<dc-import name="ModalFooter" theme="{{themeName}}" note="" buttons="{{footerButtons}}" hint-size="100%,64px"></dc-import>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["dark", "light"], "default": "dark"}, "when": {"editor": "enum", "options": ["valid", "error", "empty"], "default": "valid"}, "popover": {"editor": "enum", "options": ["none", "icon", "command", "when"], "default": "none"}, "$preview": {"width": 1280, "height": 1600}}'>

  { label: 'Link', d: 'M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1' },

  { label: 'Rocket', d: 'M5 15c-1.5 1.5-2 4-2 6 2 0 4.5-.5 6-2M9 13l2 2M14 4c3 0 6 3 6 6l-7 7-6-6Z' },
  { label: 'Bug', d: 'M9 7a3 3 0 0 1 6 0v1H9ZM7 9h10v5a5 5 0 0 1-10 0ZM4 13h3M17 13h3M5 19l2.5-2M19 19l-2.5-2M12 9v10' },
  { label: 'Search', d: 'M11 17.5a6.5 6.5 0 1 0 0-13 6.5 6.5 0 0 0 0 13ZM20 20l-4.2-4.2' },
  { label: 'Copy', d: 'M10 8h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-8a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2ZM16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2' },
  { label: 'Folder', d: 'M3.5 7.5a2 2 0 0 1 2-2h4l2 2.5h7a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2Z' },

var current = iconDefs.filter(function (ic) { return ic.label === self.state.icon; })[0] || iconDefs[1];
var icons = iconDefs.map(function (ic) {
  var on = ic.label === current.label;
  return { label: ic.label, d: ic.d, on: on,
    pick: function () { self.setState({ icon: ic.label, pop: 'none' }); },
    style: icBase + (on ? ' background: rgba(var(--accent-rgb), 0.14); border: 1px solid var(--accent); color: var(--accent-text);' : ' background: transparent; border: 1px solid transparent; color: var(--text-body);') };
});
var corner = function (open) {
  return 'position: absolute; top: 6px; right: 6px; height: 24px; display: flex; align-items: center; gap: 5px; padding: 0 8px; border-radius: 6px; font-size: 11px; font-weight: 500; cursor: pointer;' +
    (open ? ' background: var(--bg-pressed); border: 1px solid var(--border-strong); color: var(--text-strong);' : ' background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-muted);');
};
var inputDefs = [
  { id: 'PORT', type: 'text', label: 'Port', def: '3000', required: true },
  { id: 'MOCK', type: 'checkbox', label: 'Mock API', def: 'on' },
  { id: 'API', type: 'select', label: 'API target', def: 'staging', options: 'local\nstaging\nproduction', required: true, when: '!inputs.mock', whenResult: 'Hidden while Mock API is on' }
];
var typeLabels = { text: 'Text', textarea: 'Long Text', checkbox: 'Checkbox', select: 'Select', branch: 'Branch' };
var inputs = inputDefs.map(function (d) {
  var open = self.state.openInput === d.id;
  return {
    id: d.id, type: d.type, typeLabel: typeLabels[d.type], label: d.label, def: d.def, options: d.options || '',
    isSelect: d.type === 'select', when: d.when || '', hasWhen: !!d.when, whenResult: d.whenResult || '',
    required: !!d.required, open: open, removeLabel: 'Remove ' + d.label,
    toggle: function () { self.setState({ openInput: open ? null : d.id }); },
    chevronStyle: 'flex-shrink: 0; color: var(--text-muted); transition: transform 0.12s;' + (open ? ' transform: rotate(90deg);' : '')
  };
});
var when = this.props.when ?? 'valid';
var exprs = { valid: "branch.repo == 'web-app' && branch.checkedOut", error: "branch.repo == 'web-app' && branch.checkedOt", empty: '' };
var results = { valid: 'Shows for 1 of 4 branches: session-token-refresh', error: 'No such field: branch.checkedOt (did you mean checkedOut?)', empty: 'Always shown' };
var invalid = when === 'error';
var whenStyle = 'box-sizing: border-box; resize: none; padding: 10px 92px 10px 12px; background: var(--bg-sunken); border-radius: 8px; color: var(--text-code); font-family: \'JetBrains Mono\', monospace; font-size: 12px; line-height: 20px; outline: none;' + (invalid ? ' border: 1px solid var(--danger); box-shadow: 0 0 0 2px rgba(var(--danger-rgb), 0.2);' : ' border: 1px solid var(--border);');
var fields = [
  ['branch.name', 'string'], ['branch.repo', 'string'], ['branch.base', 'string'], ['branch.checkedOut', 'bool'],
  ['branch.detached', 'bool'], ['branch.uncommitted', 'int'], ['branch.ahead', 'int'], ['branch.behind', 'int'],
  ['branch.merged', 'bool'], ['branch.project', 'string, Project menu only'], ['branch.menu', "'branches' | 'project'"]
].map(function (f) { return { name: f[0], type: f[1] }; });
return {
  themeClass: 'theme-' + theme,
  themeName: theme,
  footerButtons: [{ label: 'Cancel' }, { label: 'Save Script', variant: 'primary' }],
  whenExpr: exprs[when],
  whenStyle: whenStyle,
  whenInvalid: invalid,
  whenOk: when === 'valid',
  resultText: results[when],
  resultStyle: 'display: flex; align-items: center; gap: 6px; font-size: 12px;' + (invalid ? ' color: var(--danger);' : ' color: var(--text-muted);'),
  fields: fields,
  inputs: inputs,
  icons: icons,
  iconD: current.d,
  iconOpen: pop === 'icon',
  iconBtnLabel: 'Icon: ' + current.label,
  toggleIcons: setPop('icon'),
  nameVarStyle: 'height: 28px; display: flex; align-items: center; gap: 5px; padding: 0 9px; border-radius: 6px; font-size: 11px; font-weight: 500; cursor: pointer; background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-muted);',
  iconBtnStyle: 'height: 28px; display: flex; align-items: center; gap: 4px; padding: 0 7px 0 8px; border-radius: 6px; cursor: pointer; color: var(--accent-text);' + (pop === 'icon' ? ' background: var(--bg-pressed); border: 1px solid var(--border-strong);' : ' background: var(--bg-elevated); border: 1px solid var(--border);'),
  cmdOpen: pop === 'command',
  toggleCmdInsert: setPop('command'),
  cmdBtnStyle: corner(pop === 'command'),
  whenOpen: pop === 'when',
  toggleWhenInsert: setPop('when'),
  inBtnStyle: corner(false),
  whenBtnStyle: corner(pop === 'when'),
  closeInsert: function () { self.setState({ pop: 'none' }); },
  vars: [
    ['$GITGEL_BRANCH', 'branch name'], ['$GITGEL_BASE', 'base in use'], ['$GITGEL_WORKTREE', 'empty if not checked out'],
    ['$GITGEL_REPO', 'repository folder'], ['$GITGEL_REPO_NAME', 'repository name'], ['$GITGEL_PROJECT', 'project entry menu only'], ['$GITGEL_HEAD', 'tip SHA'], ['$GITGEL_INPUT_PORT', 'input · Port'],
    ['$GITGEL_INPUT_MOCK', 'input · Mock API'], ['$GITGEL_INPUT_API', 'input · API target']
  ].map(function (v) { return { name: v[0], note: v[1] }; }),
  openOutput: self.state.openOutput,
  toggleOpenOutput: function () { self.setState({ openOutput: !self.state.openOutput }); }
};
}
}
</script>
