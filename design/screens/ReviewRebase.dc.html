<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rebase stopped on conflicts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&amp;display=swap">
<style>body{margin:0;background:#141311}</style>
</helmet>
<div style="width: 1280px; height: 800px; overflow: hidden">
<dc-import name="ReviewFocus" op="rebase" theme="{{theme}}" hint-size="1280px,800px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  // Rebase of session-token-refresh onto main stopped on session.ts: the banner (names, 2/4, Abort / Continue), "rebasing" on the head, ⚠ on the file. + on it marks it resolved (✓); Continue then finishes, Abort asks first.
  renderVals() { return { theme: this.props.theme || 'dark' }; }
}
</script>
</body>
</html>
