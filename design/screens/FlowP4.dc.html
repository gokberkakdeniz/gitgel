<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>P4 · Stash several entries</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&amp;display=swap">
<style>
body{margin:0;font-family:'Instrument Sans',-apple-system,sans-serif;background:#141311;color:#d8d4cc}
a{color:var(--accent-text,#7fb3c4);text-decoration:none}a:hover{color:var(--accent-hover,#a3cad6)}
button,input,textarea{font-family:inherit}
.theme-dark{--bg-sidebar:#0e0d0c;--bg-main:#141311;--bg-sunken:#1a1917;--bg-band:#1c1b18;--bg-elevated:#211f1c;--bg-track:#211f1c;--bg-hover:#2a2825;--bg-sidebar-active:#24221f;--bg-pressed:#383631;--border:#302e2a;--border-row:#262420;--border-strong:#383631;--text-strong:#faf9f5;--text-code:#e0ddd6;--text-body:#d8d4cc;--text-muted:#a09d96;--text-faint:#75726b;--text-disabled:#5c5a55;--icon-disabled:#4a4843;--accent:#4f8fa3;--accent-text:#7fb3c4;--accent-hover:#a3cad6;--on-accent:#141311;--success:#8fcf9c;--warning:#e8c071;--danger:#ee9a90;--kind-r:#93b8ee;--kind-u:#c5b2f2;--accent-rgb:79,143,163;--success-rgb:93,184,114;--warning-rgb:212,160,23;--danger-rgb:198,69,69;--kind-r-rgb:90,140,220;--kind-u-rgb:160,130,230;--shadow:rgba(0,0,0,0.45);--scrim:rgba(0,0,0,0.5)}
.theme-light{--bg-sidebar:#f1efea;--bg-main:#fbfaf7;--bg-sunken:#f4f2ee;--bg-band:#eeebe5;--bg-elevated:#ffffff;--bg-track:#e9e6e0;--bg-hover:#ebe8e1;--bg-sidebar-active:#e4e0d8;--bg-pressed:#ffffff;--border:#e2ded6;--border-row:#ebe8e2;--border-strong:#d5d0c7;--text-strong:#1d1c19;--text-code:#2b2925;--text-body:#3b3934;--text-muted:#6e6a62;--text-faint:#99958c;--text-disabled:#b7b2a9;--icon-disabled:#cbc6bd;--accent:#3a7b8f;--accent-text:#2c6a7d;--accent-hover:#1f5566;--on-accent:#ffffff;--success:#2e7a45;--warning:#8a6212;--danger:#b3463b;--kind-r:#2f63a8;--kind-u:#6a4fb5;--accent-rgb:58,123,143;--success-rgb:46,140,78;--warning-rgb:196,146,20;--danger-rgb:200,72,60;--kind-r-rgb:60,110,200;--kind-u-rgb:140,100,220;--shadow:rgba(40,32,20,0.14);--scrim:rgba(30,26,20,0.28)}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 1280px; height: 800px; display: flex; position: relative; background: var(--bg-main); overflow: hidden; font-size: 13px; font-family: 'Instrument Sans', -apple-system, sans-serif; color: var(--text-body)">
<dc-import name="Diff" scope="project" mode="Uncommitted" base-menu="{{false}}" theme="{{themeName}}" hint-size="1280px,800px"></dc-import>
<div role="dialog" aria-label="Stash changes" style="position: absolute; top: 54px; left: 844px; width: 420px; box-sizing: border-box; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 16px 40px var(--shadow); display: flex; flex-direction: column; gap: 12px; padding: 16px; z-index: 5">
<div style="font-family: 'Source Serif 4', Georgia, serif; font-size: 18px; letter-spacing: -0.3px; color: var(--text-strong)">Stash changes</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; font-weight: 500; color: var(--text-body); padding-bottom: 4px">In</span>
<div style="display: flex; align-items: center; gap: 8px; height: 26px; color: var(--text-body)"><label style="flex-grow: 1; min-width: 0; display: flex; align-items: center; gap: 8px; cursor: pointer"><span role="checkbox" aria-checked="mixed" aria-label="Stash session-token-refresh" style="width: 16px; height: 16px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 4px; background: var(--accent); color: var(--on-accent)"><span style="width: 8px; height: 2px; border-radius: 1px; background: var(--on-accent)"></span></span><span style="font-size: 12px; font-weight: 600; color: var(--text-strong)">web-app</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">session-token-refresh</span></label><button aria-expanded="true" title="Hide files" style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; height: 22px; padding: 0 6px; margin-right: -6px; border: 0; border-radius: 8px; font-size: 12px; cursor: pointer; background: var(--bg-hover); color: var(--text-body)">2 of 3 files<dc-import name="Icon" icon="chevron-down" size="10" hint-size="10px,10px"></dc-import></button></div>
<label style="display: flex; align-items: center; gap: 8px; height: 26px; padding-left: 24px; min-width: 0; cursor: pointer"><span role="checkbox" aria-checked="true" aria-label="Stash src/auth/refresh.ts" style="width: 16px; height: 16px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 4px; background: var(--accent); color: var(--on-accent)"><dc-import name="Icon" icon="check" size="11" stroke="3" hint-size="11px,11px"></dc-import></span><dc-import name="KindBadge" theme="none" kind="M" hint-size="18px,18px"></dc-import><span style="flex-shrink: 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-strong)">refresh.ts</span><span style="min-width: 0; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">src/auth</span></label>
<label style="display: flex; align-items: center; gap: 8px; height: 26px; padding-left: 24px; min-width: 0; cursor: pointer"><span role="checkbox" aria-checked="true" aria-label="Stash src/auth/session.ts" style="width: 16px; height: 16px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 4px; background: var(--accent); color: var(--on-accent)"><dc-import name="Icon" icon="check" size="11" stroke="3" hint-size="11px,11px"></dc-import></span><dc-import name="KindBadge" theme="none" kind="M" hint-size="18px,18px"></dc-import><span style="flex-shrink: 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-strong)">session.ts</span><span style="min-width: 0; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">src/auth</span></label>
<label style="display: flex; align-items: center; gap: 8px; height: 26px; padding-left: 24px; min-width: 0; cursor: pointer"><span role="checkbox" aria-checked="false" aria-label="Stash token-debug.ts" style="width: 16px; height: 16px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 4px; border: 1.5px solid var(--border-strong)"></span><dc-import name="KindBadge" theme="none" kind="U" hint-size="18px,18px"></dc-import><span style="flex-shrink: 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-strong)">token-debug.ts</span><span style="min-width: 0; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">scripts · untracked</span></label>
<div style="display: flex; align-items: center; gap: 8px; height: 26px; color: var(--text-body)"><label style="flex-grow: 1; min-width: 0; display: flex; align-items: center; gap: 8px; cursor: pointer"><span role="checkbox" aria-checked="true" aria-label="Stash session-cookie-cleanup" style="width: 16px; height: 16px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 4px; background: var(--accent); color: var(--on-accent)"><dc-import name="Icon" icon="check" size="11" stroke="3" hint-size="11px,11px"></dc-import></span><span style="font-size: 12px; font-weight: 600; color: var(--text-strong)">web-app</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">session-cookie-cleanup</span></label><button aria-expanded="false" title="Pick files" style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; height: 22px; padding: 0 6px; margin-right: -6px; border: 0; border-radius: 8px; font-size: 12px; cursor: pointer; background: transparent; color: var(--text-muted)">1 file<dc-import name="Icon" icon="chevron-right" size="10" hint-size="10px,10px"></dc-import></button></div>
<div style="display: flex; align-items: center; gap: 8px; height: 26px; color: var(--text-body)"><label style="flex-grow: 1; min-width: 0; display: flex; align-items: center; gap: 8px; cursor: pointer"><span role="checkbox" aria-checked="false" aria-label="Stash token-rotation-job" style="width: 16px; height: 16px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 4px; border: 1.5px solid var(--border-strong)"></span><span style="font-size: 12px; font-weight: 600; color: var(--text-strong)">api-server</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">token-rotation-job</span></label><button aria-expanded="false" title="Pick files" style="flex-shrink: 0; display: flex; align-items: center; gap: 4px; height: 22px; padding: 0 6px; margin-right: -6px; border: 0; border-radius: 8px; font-size: 12px; cursor: pointer; background: transparent; color: var(--text-muted)">0 of 2 files<dc-import name="Icon" icon="chevron-right" size="10" hint-size="10px,10px"></dc-import></button></div>
<div style="display: flex; align-items: center; gap: 8px; height: 26px; color: var(--text-disabled)"><label style="flex-grow: 1; min-width: 0; display: flex; align-items: center; gap: 8px; cursor: default"><span role="checkbox" aria-checked="false" aria-label="Stash session-revoke-endpoint" style="width: 16px; height: 16px; flex-shrink: 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 4px; border: 1.5px solid var(--border-strong); opacity: 0.55"></span><span style="font-size: 12px; font-weight: 600; color: var(--text-disabled)">api-server</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">session-revoke-endpoint</span></label><span style="font-size: 12px; color: var(--text-muted)">no changes</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 500; color: var(--text-body)">Message</span>
<input aria-label="Message" value="before rebasing on main" style="height: 32px; box-sizing: border-box; width: 100%; padding: 0 10px; background: var(--bg-elevated); border: 1px solid var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.22); border-radius: 8px; color: var(--text-strong); font-size: 13px; outline: none">
</div>
<div style="font-size: 12px; color: var(--text-muted); line-height: 1.45">One stash per entry, same message. Both are in web-app, so its stack gets 2 new stashes.</div>
<div style="display: flex; justify-content: flex-end; gap: 8px">
<button style="height: 32px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 14px; border-radius: 8px; font-size: 13px; white-space: nowrap; cursor: pointer; background: var(--bg-hover); border: 1px solid var(--border-strong); color: var(--text-strong); ">Cancel</button>
<button style="height: 32px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 14px; border-radius: 8px; font-size: 13px; white-space: nowrap; cursor: pointer; background: var(--accent); border: 0; color: var(--on-accent); font-weight: 600; ">Stash 2 entries ↵</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["dark", "light"], "default": "dark"}, "$preview": {"width": 1280, "height": 800}}'>
class Component extends DCLogic {
  renderVals() {
    var t = this.props.theme || 'dark';
    // The Review screen is the shared Diff artboard (Uncommitted); the popover opens from Stash in
    // its ⋮ page menu, right-aligned under the button.
    // Stash changes: each entry's box picks all or none of its files (a dash when only some are);
    // "N files ›" shows them under it to pick one by one. An untracked file goes when it is picked
    // (no separate untracked option). token-rotation-job has none picked, so 2 entries are stashed.
    return { themeClass: 'theme-' + t, themeName: t };
  }
}
</script>
</body>
</html>
