<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>V3 · New branch, repository folder</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&amp;display=swap">
<style>
body{margin:0;font-family:'Instrument Sans',-apple-system,sans-serif;background:#141311;color:#d8d4cc}
</style>
</helmet>
<div style="width: 1280px; height: 800px">
<dc-import name="FlowV2" case="checkout" dirty="{{true}}" theme="{{theme}}" hint-size="1280px,800px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
// V2 with "Repository folder" picked: its uncommitted changes open under it (Bring to new branch
// / Stash).
return { theme: this.props.theme ?? 'dark' };
}
}
</script>
</body>
</html>
