<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hi12 · Pick several rows</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&amp;display=swap">
<style>body{margin:0;background:#141311}</style>
</helmet>
<div style="width: 1280px; height: 800px; overflow: hidden">
<dc-import name="HistH6" state="range" theme="{{theme}}" hint-size="1280px,800px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    // History of web-app / session-token-refresh (Hi5): Uncommitted, e8b2c41 and 5c0d7aa picked
    // with ⌘ / ⇧-click, tinted; the files of the three taken together under the oldest. The pane:
    // b41f9e3 (5c0d7aa's parent) ↔ working tree. No commit form while several rows are picked.
    return { theme: this.props.theme || 'dark' };
  }
}
</script>
</body>
</html>
