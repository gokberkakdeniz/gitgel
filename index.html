<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gitgel</title>
    <script>
      // Monaco's automatic layout trips this harmless WebKit notice; keep it out of the console.
      window.addEventListener(
        'error',
        (e) => {
          if (/^ResizeObserver loop/.test(e.message)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        },
        true,
      );
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
